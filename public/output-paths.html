<meta charset="utf-8">
<title>End of chat — two ways out</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--plum:#4A2A6E;--plum2:#6B3C72;--violet:#7C4FC7;--ink:#1A1A1A;--ink2:#4A3E5C;
        --muted:#7E7490;--muted2:#A79FB6;--line:#EBE5F1;--line2:#E1D9EC;--lilac:#EFE8F8;--lilac3:#F5F0FB;
        --disp:"Baloo 2",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;--chat:"Jua",system-ui,sans-serif}
  body{font-family:var(--body);color:var(--ink);background:#fff;height:100vh;overflow:hidden}
  .wrap{display:flex;height:100vh}
  .rail{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .rail-h{padding:13px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .spark{width:22px;height:22px;border-radius:7px;background:var(--plum2);display:grid;place-items:center}
  .spark svg{width:12px;height:12px;fill:#fff}
  .brand{font-family:var(--disp);font-weight:700;font-size:14px}
  .hint{margin-left:auto;font-size:11.5px;color:var(--muted2)}
  .thread{flex:1;overflow-y:auto;padding:24px 26px 40px;min-height:0}
  .ai{font-family:var(--chat);font-size:15px;color:#140934;line-height:1.6;margin-bottom:16px}
  .user{display:flex;justify-content:flex-end;margin-bottom:16px}
  .user span{max-width:85%;background:#e7e7e7;border-radius:12px 12px 0 12px;padding:10px 14px;font-family:var(--chat);font-size:14px;opacity:.7}
  .fade{opacity:0;transform:translateY(10px);transition:.45s cubic-bezier(.22,1,.36,1)}
  .fade.in{opacity:1;transform:none}

  /* the two ways out */
  .paths{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 20px}
  .path{position:relative;text-align:left;border:1px solid var(--line2);border-radius:16px;background:#fff;padding:18px 18px 16px;cursor:pointer;transition:.16s;overflow:hidden}
  .path:hover{border-color:var(--violet);box-shadow:0 4px 18px rgba(74,42,110,.10)}
  .path .ic{width:34px;height:34px;border-radius:11px;background:var(--lilac3);display:grid;place-items:center;margin-bottom:11px}
  .path .ic svg{width:17px;height:17px;color:var(--plum2)}
  .path b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;margin-bottom:5px}
  .path p{font-size:12.5px;color:var(--muted);line-height:1.55}
  .path .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-family:var(--disp);font-size:12px;font-weight:700;color:var(--plum2)}
  .path .tag{position:absolute;top:14px;right:14px;font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
             background:var(--lilac);color:var(--plum2);padding:3px 7px;border-radius:5px}

  /* template picker — same presentation as the existing one in the flow */
  .tpl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 20px}
  .t{position:relative;text-align:left;background:#fff;border:1px solid #e5e5e2;border-radius:16px;padding:16px;cursor:pointer;transition:.16s;overflow:hidden}
  .t:hover{border-color:var(--plum2);box-shadow:0 4px 14px rgba(74,42,110,.10)}
  .t .row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
  .t .emoji{font-size:20px;line-height:1;margin-top:1px}
  .t .name{font-family:var(--chat);font-size:13.5px;color:var(--ink);line-height:1.35}
  .t:hover .name{color:var(--plum2)}
  .t .good{font-family:var(--chat);font-size:11.5px;color:#777;line-height:1.5}
  .t .out{max-height:0;overflow:hidden;transition:.22s}
  .t:hover .out{max-height:160px}
  .t .out .k{font-family:var(--chat);font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:#9a9a9a;margin:10px 0 5px}
  .t .out div{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .t .out i{width:4px;height:4px;border-radius:50%;background:#b89fc4;flex:0 0 auto}
  .t .out span{font-family:var(--chat);font-size:11px;color:#555}
  .t .use{margin-top:10px;font-family:var(--chat);font-size:11px;color:var(--plum2);opacity:0;transition:.15s}
  .t:hover .use{opacity:1}

  .opened{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #BFE3CE;background:#F0FAF4;border-radius:12px;margin-bottom:16px}
  .opened .tick{width:20px;height:20px;border-radius:50%;background:#1F7A4C;display:grid;place-items:center;flex:0 0 auto}
  .opened .tick svg{width:11px;height:11px;stroke:#fff}
  .opened b{font-family:var(--disp);font-size:13px;color:#123D28;display:block}
  .opened span{font-size:11.5px;color:#245239}
  .opened a{margin-left:auto;font-family:var(--disp);font-size:12px;font-weight:700;color:#1F7A4C;text-decoration:none;white-space:nowrap}
  .opened a:hover{text-decoration:underline}
</style>

<div class="wrap">
  <div class="rail">
    <div class="rail-h">
      <span class="spark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
      <span class="brand">Ask Lumos</span>
      <span class="hint">End of the analysis — both paths open in a new tab</span>
    </div>
    <div class="thread" id="thread"></div>
  </div>
</div>

<script>
var thread = document.getElementById('thread');
function add(html, delay) {
  var d = document.createElement('div'); d.className = 'fade'; d.innerHTML = html;
  thread.appendChild(d);
  setTimeout(function () { d.classList.add('in'); thread.scrollTop = thread.scrollHeight; }, delay || 30);
  return d;
}

var TEMPLATES = [
  { id:'campaign-strategy', icon:'📣', name:'Campaign Strategy Brief',
    good:'Planning integrated media campaigns and creative direction across channels.',
    out:['Audience overview & sizing','Channel mix & media weighting','Messaging angles by segment','Timing & seasonality','Creative direction'] },
  { id:'insight-report', icon:'📊', name:'Executive Insight Report',
    good:'Stakeholder presentations and leadership briefings with clear opportunity sizing.',
    out:['Executive summary','Audience profiles & index','Geographic concentration','Market opportunity sizing','Strategic recommendations'] },
  { id:'conquest-plan', icon:'🎯', name:'Conquest Activation Plan',
    good:'Identifying competitor brand switchers and new-to-brand conquest opportunities.',
    out:['Competitive landscape','Switching opportunity','Conquest priorities','Activation tactics'] },
  { id:'launch-playbook', icon:'🚀', name:'Launch Playbook',
    good:'End-to-end launch planning with events, timing and success metrics.',
    out:['Objectives & KPIs','Segment prioritisation','Channel activation plan','Opening weekend','Measurement'] }
];

function openTab(url, label, note) {
  window.open(url, '_blank');
  var el = add('<div class="opened"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>' +
    '<span><b>' + label + '</b><span>' + note + '</span></span>' +
    '<a href="' + url + '" target="_blank">Open again ↗</a></div>', 40);
  return el;
}

function showTemplates() {
  add('<div class="ai">Which format works best? Each template structures the same findings differently.</div>', 30);
  var wrap = add('<div class="tpl">' + TEMPLATES.map(function (t) {
    return '<button class="t" data-t="' + t.id + '"><div class="row"><span class="emoji">' + t.icon + '</span>' +
      '<span class="name">' + t.name + '</span></div><div class="good">' + t.good + '</div>' +
      '<div class="out"><div class="k">AI will output</div>' +
      t.out.map(function (o) { return '<div><i></i><span>' + o + '</span></div>'; }).join('') + '</div>' +
      '<div class="use">Use this template →</div></button>';
  }).join('') + '</div>', 120);
  wrap.querySelectorAll('.t').forEach(function (b) {
    b.onclick = function () {
      var t = TEMPLATES.filter(function (x) { return x.id === b.dataset.t; })[0];
      add('<div class="user"><span>Use the ' + t.name + '</span></div>', 20);
      add('<div class="ai">Building it now — the same findings, structured as a ' + t.name.toLowerCase() + '.</div>', 200);
      setTimeout(function () {
        openTab('output-report.html?t=' + t.id, t.name + ' opened in a new tab',
          'Share it from the button in the top right of that tab.');
      }, 900);
    };
  });
}

function start() {
  add('<div class="ai">That’s the case made. I can package it two ways — and both open in their own tab so you can keep this conversation going.</div>', 30);
  var paths = add('<div class="paths">' +
    '<button class="path" id="pSummary"><span class="tag">Interactive</span>' +
      '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/></svg></span>' +
      '<b>Summarise into a shareable page</b><p>One page with the findings, the evidence charts and the live map — every chart still clickable. Best for sending to someone who wants to poke at it.</p>' +
      '<span class="go">Build the page →</span></button>' +
    '<button class="path" id="pDoc"><span class="tag">Document</span>' +
      '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8"/></svg></span>' +
      '<b>Generate a templated output</b><p>A structured document — brief, insight report, conquest plan or launch playbook. Best for circulating to people who want the conclusion, not the tool.</p>' +
      '<span class="go">Pick a template →</span></button>' +
    '</div>', 160);

  paths.querySelector('#pSummary').onclick = function () {
    add('<div class="user"><span>Summarise this into a shareable page</span></div>', 20);
    add('<div class="ai">Pulling the findings, the six signals and the catchment map onto one page.</div>', 200);
    setTimeout(function () {
      openTab('output-summary.html', 'Findings page opened in a new tab',
        'Share it from the button in the top right of that tab.');
    }, 900);
  };
  paths.querySelector('#pDoc').onclick = function () {
    add('<div class="user"><span>Generate a templated output</span></div>', 20);
    setTimeout(showTemplates, 300);
  };
}
start();
</script>
