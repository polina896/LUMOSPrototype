<meta charset="utf-8">
<title>Digital twin mode — talk to the audiences</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --plum:#4A2A6E; --plum2:#6B3C72; --violet:#7C4FC7;
    --ink:#1A1A1A; --ink2:#4A3E5C; --muted:#7E7490; --muted2:#A79FB6;
    --line:#EBE5F1; --line2:#E1D9EC; --lilac:#EFE8F8; --lilac3:#F5F0FB;
    /* the twin mode has its own accent, so the shift is unmistakable */
    --twin:#0E7490; --twin-deep:#0B5A70; --twin-tint:#F0F9FB; --twin-line:#C7E4EC;
    --t1:#7A4C82; --t2:#2F8F63; --t3:#C07A2E;
    --disp:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --chat:"Jua",system-ui,sans-serif;
  }
  body{font-family:var(--body);color:var(--ink);background:#F7F6F9;height:100vh;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh}

  /* demo strip — not part of the design */
  .demo{display:flex;align-items:center;gap:12px;padding:9px 20px;background:#2E2E2E;color:#fff;flex:0 0 auto}
  .demo b{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A93A8}
  .demo button{border:1px solid #4A4A4A;background:#3A3A3A;color:#ddd;font-family:var(--disp);font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer}
  .demo button:hover{border-color:#7C4FC7;color:#fff}
  .demo span{font-size:11.5px;color:#9A93A8;margin-left:auto}

  .app{flex:1;display:flex;min-height:0;background:#fff}
  .rail{width:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
        transition:background .35s}
  .rail.twin{background:var(--twin-tint)}

  .head{display:flex;align-items:center;gap:10px;padding:13px 26px;border-bottom:1px solid var(--line);flex:0 0 auto;transition:.35s}
  .rail.twin .head{background:#fff;border-bottom-color:var(--twin-line)}
  .mark{width:24px;height:24px;border-radius:8px;background:var(--plum2);display:grid;place-items:center;transition:background .35s}
  .rail.twin .mark{background:var(--twin)}
  .mark svg{width:13px;height:13px;fill:#fff}
  .head .t{font-family:var(--disp);font-size:14px;font-weight:700}
  .head .s{font-size:11.5px;color:var(--muted)}
  .head .badge{margin-left:auto;display:none;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--twin-tint);border:1px solid var(--twin-line);
               font-family:var(--disp);font-size:11px;font-weight:800;color:var(--twin-deep)}
  .rail.twin .head .badge{display:flex}
  .head .badge i{width:7px;height:7px;border-radius:50%;background:var(--twin);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,116,144,.45)}70%{box-shadow:0 0 0 7px rgba(14,116,144,0)}100%{box-shadow:0 0 0 0 rgba(14,116,144,0)}}

  /* who is in the room — only in twin mode */
  .room{display:none;gap:8px;padding:11px 26px;border-bottom:1px solid var(--twin-line);background:#fff;flex:0 0 auto;overflow-x:auto}
  .rail.twin .room{display:flex;align-items:center}
  .room-k{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2);flex:0 0 auto;margin-right:3px}
  .tw{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border:1px solid var(--line2);border-radius:99px;background:#fff;white-space:nowrap;cursor:pointer;transition:.15s}
  .tw:hover{border-color:var(--twin)}
  .tw.off{opacity:.42}
  .tw .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-size:9.5px;font-weight:800}
  .tw b{font-family:var(--disp);font-size:12px;font-weight:700;display:block;line-height:1.15}
  .tw span{font-size:10.5px;color:var(--muted);line-height:1.15}

  .thread{flex:1;overflow-y:auto;padding:22px 26px 30px;min-height:0}
  .ai{font-family:var(--chat);font-size:15px;color:#140934;line-height:1.6;margin-bottom:16px}
  .user{display:flex;justify-content:flex-end;margin-bottom:16px}
  .user span{max-width:82%;background:#e7e7e7;border-radius:12px 12px 0 12px;padding:10px 14px;font-family:var(--chat);font-size:14px;opacity:.72;line-height:1.55}
  .rail.twin .user span{background:#fff;border:1px solid var(--twin-line);opacity:1;color:#0B3B47}
  .fade{opacity:0;transform:translateY(10px);transition:.45s cubic-bezier(.22,1,.36,1)}
  .fade.in{opacity:1;transform:none}
  .sys{display:flex;align-items:center;gap:9px;margin:4px 0 18px;padding:10px 13px;border:1px dashed var(--twin-line);background:#fff;border-radius:12px}
  .sys .ic{width:22px;height:22px;border-radius:7px;background:var(--twin-tint);display:grid;place-items:center;flex:0 0 auto}
  .sys .ic svg{width:12px;height:12px;stroke:var(--twin)}
  .sys p{font-size:12.5px;color:var(--ink2);line-height:1.5}
  .sys p b{color:var(--twin-deep)}

  /* a twin's reply */
  .reply{border:1px solid var(--line2);background:#fff;border-radius:15px;padding:14px 16px 13px;margin-bottom:11px}
  .reply .rh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .reply .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--disp);font-size:10.5px;font-weight:800;flex:0 0 auto}
  .reply .rh > span:not(.av):not(.score){min-width:0}
  .reply .nm{display:block;font-family:var(--disp);font-size:13px;font-weight:700;line-height:1.25}
  .reply .sub{display:block;font-size:10.5px;color:var(--muted);line-height:1.25;margin-top:2px}
  .reply .score{margin-left:auto;text-align:right;flex:0 0 auto}
  .reply .score b{font-family:var(--disp);font-size:16px;font-weight:800;line-height:1}
  .reply .score span{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-top:2px}
  .meter{height:5px;border-radius:99px;background:#F0EDF4;overflow:hidden;margin-bottom:10px}
  .meter i{display:block;height:100%;border-radius:99px;width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
  .reply q{display:block;font-family:var(--chat);font-size:14px;line-height:1.6;color:var(--ink);quotes:none}
  .reply .why{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
  .reply .why b{color:var(--ink2)}

  /* Lumos' read across the room */

  .sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .sugg button{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 13px;font-family:var(--chat);font-size:13px;color:var(--ink);cursor:pointer;transition:.15s;text-align:left}
  .sugg button:hover{border-color:var(--twin);background:var(--twin-tint)}

  /* the prompt library — a starting point, never the only way in */
  .lib{border:1px solid var(--line2);background:#fff;border-radius:15px;padding:14px 16px 12px;margin-bottom:18px}
  .lib-h{font-family:var(--disp);font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:11px}
  .lib-g{margin-bottom:11px}
  .lib-g:last-of-type{margin-bottom:6px}
  .lib-k{font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
  .lib-r{display:flex;flex-wrap:wrap;gap:7px}
  .lib-r button{display:inline-flex;align-items:baseline;gap:7px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 12px;
                font-family:var(--chat);font-size:13px;color:var(--ink);cursor:pointer;transition:.15s;text-align:left}
  .lib-r button:hover{border-color:var(--twin);background:var(--twin-tint)}
  .lib-hint{font-family:var(--body);font-size:10.5px;color:var(--muted2);font-weight:600}
  .lib-f{padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2)}

  /* composer + the mode switch that sits with it */
  .foot{flex:0 0 auto;padding:0 26px 20px}
  .modes{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .seg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:#F4F2F7;border:1px solid var(--line2)}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:8px;font-family:var(--disp);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
  .seg button svg{width:13px;height:13px}
  .seg button.on{background:#fff;color:var(--plum2);box-shadow:0 1px 3px rgba(33,26,46,.12)}
  .seg button.on[data-mode=twin]{color:var(--twin-deep)}
  .seg button:disabled{opacity:.45;cursor:not-allowed}
  .modes .lock{font-size:11.5px;color:var(--muted2)}
  .modes .lock b{color:var(--muted)}

  .box{border:1px solid #ccc;border-radius:12px;background:#fff;padding:12px 14px;transition:.2s}
  .box:focus-within{border-color:var(--plum2);box-shadow:0 0 0 3px rgba(107,60,114,.1)}
  .rail.twin .box{border-color:var(--twin-line);box-shadow:0 0 0 3px rgba(14,116,144,.07)}
  .rail.twin .box:focus-within{border-color:var(--twin);box-shadow:0 0 0 3px rgba(14,116,144,.14)}
  .box textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--chat);font-size:14px;line-height:1.55;color:#000;min-height:44px}
  .box textarea::placeholder{color:#aaa}
  .brow{display:flex;align-items:center;gap:10px;margin-top:6px}
  .brow .hint{font-size:11px;color:var(--muted2)}
  .brow .send{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--plum2);display:grid;place-items:center;cursor:pointer;border:none;transition:background .2s}
  .rail.twin .brow .send{background:var(--twin)}
  .brow .send svg{width:15px;height:15px;stroke:#fff}
</style>

<div class="wrap">
  <div class="demo">
    <b>Prototype controls</b>
    <button id="dAud">Toggle: audiences identified</button>
    <button id="dReset">Reset</button>
    <span id="dState"></span>
  </div>

  <div class="app">
    <div class="rail" id="rail">
      <div class="head">
        <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
        <div><div class="t" id="headT">Ask Lumos</div><div class="s" id="headS">Costco — Western Sydney launch</div></div>
        <span class="badge"><i></i>Digital twin mode</span>
      </div>

      <div class="room" id="room"></div>
      <div class="thread" id="thread"></div>

      <div class="foot">
        <div class="modes">
          <div class="seg" id="seg">
            <button data-mode="lumos" class="on">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg>Ask Lumos</button>
            <button data-mode="twin">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 20a5 5 0 016.5-4.4"/></svg>Ask the twins</button>
          </div>
          <span class="lock" id="lockNote"></span>
        </div>
        <div class="box">
          <textarea id="input" rows="2" placeholder="Reply to Lumos"></textarea>
          <div class="brow">
            <span class="hint" id="hint"></span>
            <button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── the twins ───────────────────────────────────────────────────────────────
   Each answers from its own behaviour. What they answer *about* is up to the
   reader — the question is classified, and the reply takes the shape that
   question deserves. Copy gets scored; a question about their lives does not. */
var TWINS = [
  { id:'stockup', n:'Marsden Park Stock-Ups', sub:'186k · index 169', c:'#7A4C82', on:true },
  { id:'value',   n:'Parramatta Value Families', sub:'248k · index 218', c:'#2F8F63', on:true },
  { id:'bulk',    n:'Castle Hill Bulk Buyers', sub:'132k · index 186', c:'#C07A2E', on:true }
];

/* what the reader might want to know, and how each twin answers it */
var ANSWERS = {
  copy: {
    label:'Reading it against their trip planning, price sensitivity and what each already buys',
    scored:true,
    stockup:{ score:42,
      say:'“Every day” isn’t how I shop. I go once a month, I plan it on the Thursday, and I drive 25 minutes with the back seats down. Tell me what fits in the boot, not what’s cheap today.',
      why:'<b>Median trip 14 km</b> · 57% of visits on a weekend · chained to Bunnings and IKEA' },
    value:{ score:71,
      say:'Price talks, but “save big” doesn’t tell me anything. Show me the unit price against what I pay now. I’m buying for two households and I’ll do the maths myself.',
      why:'Switches on <b>unit price</b> rather than brand · fortnightly shop · buys for more than one family' },
    bulk:{ score:28,
      say:'I already have a membership somewhere else. Cheap isn’t the reason I’d switch — the range is. If you carry things I can’t get at the local shops, say that first.',
      why:'Most already hold a <b>warehouse membership elsewhere</b> · fewest trips, biggest baskets' },
  },

  demographics: {
    label:'Answering from household composition, income and where they live',
    stockup:{ say:'Two adults, three kids, a four-bedroom place in one of the new estates off Richmond Road. Two cars, because out here you need them. Most of what we earn goes on the mortgage and the children.',
      why:'<b>66% are four-person households or larger</b> · North-West growth corridor · two-car households index 1.9×' },
    value:{ say:'There are six of us under one roof — my parents, us, and the two kids. We shop as one household even though we are really two. The income looks fine on paper; per person it is not.',
      why:'<b>2.8× more likely</b> to shop for more than one household · multi-generational · Parramatta–Granville spine' },
    bulk:{ say:'Two of us now the children have gone, but I still buy like there are five. Big house, established street, and we have people over a lot.',
      why:'Established families · <b>fewest trips, biggest baskets</b> · premium and entertaining lines' },
    read:'Three different shapes of household buying at the same scale for <b>three different reasons</b> — a growing family, a shared roof, and entertaining. Only the first is about to get bigger.'
  },

  routine: {
    label:'Answering from observed trip timing and frequency',
    stockup:{ say:'Weekdays are school, work and the drive. The big shop is Saturday morning — drop-off, a coffee, Bunnings, and we are at Costco by eleven.',
      why:'<b>38% run the same Saturday chain</b> · arrival window 10–11am · 57% of visits on a weekend' },
    value:{ say:'Fortnightly, usually a Thursday evening or a Sunday once everyone has eaten. Whoever has the car that day does the run for both families.',
      why:'Fortnightly rhythm · short drive or on foot · <b>68% return within 60 days</b>' },
    bulk:{ say:'Once every six weeks or so, always with a list. I would rather do one enormous run than five small ones.',
      why:'Fewest trips of the three · largest average basket · plans around entertaining' },
    read:'The trip is <b>planned in all three cases</b>, but on different clocks — weekly rhythm for one, fortnightly for another, seasonal for the third. Media weight should follow the clock, not the calendar.'
  },

  motivation: {
    label:'Answering on what would actually move them',
    stockup:{ say:'Fitting the whole month into one trip. If I have to come back in a fortnight, it did not work and I will not bother again.',
      why:'Basket <b>3.4× the metro household</b> · one planned trip per month · travels 14 km for it' },
    value:{ say:'Unit price, stated plainly. And if my sister says it is worth it, that counts for more than any advertisement you can buy.',
      why:'Switches on unit price · <b>referral outperforms paid media</b> in this cluster' },
    bulk:{ say:'Range. I would move for things I cannot get locally — not for a few dollars off something I already buy.',
      why:'Already holds a membership elsewhere · premium and entertaining lines · switching is a range argument' },
    read:'Three different levers: <b>scale, unit price and range</b>. A single national message will win one of them and lose the other two.'
  },

  channel: {
    label:'Answering on where they would actually see you',
    stockup:{ say:'On the road. I am on the M7 or Richmond Road twice a day, every day. I have not opened a catalogue in years.',
      why:'Passes the corridor twice daily · <b>roadside OOH indexes highest</b> of any channel here' },
    value:{ say:'WhatsApp, honestly — that is where things get passed around. And the screens around the Parramatta interchange, I am through there constantly.',
      why:'Referral and community networks · digital OOH at the interchange · multicultural radio' },
    bulk:{ say:'Nothing that looks like a discount flyer. Email me something specific and I will read it; the rest I ignore.',
      why:'Low response to price-led creative · responds to range and event messaging' },
    read:'Two of the three are reached <b>on the way</b>, not at home. The third is reached by someone they trust rather than by media at all.'
  },

  objection: {
    label:'Answering on what would stop them',
    stockup:{ say:'The drive, if the trip does not pay for itself. And a membership fee I cannot see the value of before I have paid it.',
      why:'25-minute drive each way · <b>value must be legible before the first trip</b>' },
    value:{ say:'Bulk I have nowhere to put. And anything where the unit price is not actually better once I work it out.',
      why:'Storage-constrained · calculates unit price · <b>61% cross-shop discount grocers</b>' },
    bulk:{ say:'I already pay for one membership. Two feels absurd unless one of them is clearly better.',
      why:'Existing warehouse membership is <b>the single biggest barrier</b> in this cluster' },
    read:'The barriers are not shared. One is about <b>proof before purchase</b>, one about storage, one about paying twice — and each needs answering separately.'
  },

  general: {
    label:'Answering in their own words',
    stockup:{ say:'Ask me about the trip and I can tell you a lot — when I go, how far, what else I do on the way. That is the part of my life this is really about.',
      why:'Strongest signal: <b>trip length, timing and chaining</b>' },
    value:{ say:'Ask me about price or about who I am buying for. Those two things explain nearly everything about how I shop.',
      why:'Strongest signal: <b>unit price sensitivity and household size</b>' },
    bulk:{ say:'Ask me what I cannot get locally. That is the only thing that would make me change where I shop.',
      why:'Strongest signal: <b>range and existing membership</b>' },
    read:'Try asking about their <b>household, their week, what would move them, where they see advertising</b>, or paste a line of copy to test.'
  }
};

/* the prompt library — a starting point, not a menu */
var PROMPTS = [
  { g:'Test creative', items:[
    { t:'Save big at Costco. Unbeatable prices, every day.', hint:'a line to react to' },
    { t:'Rewrite this for a roadside billboard on the M7.' }
  ]},
  { g:'Understand them', items:[
    { t:'Who are you, in your own words?' },
    { t:'What does a typical week look like?' }
  ]},
  { g:'Dig deeper', items:[
    { t:'What would make you switch from where you shop now?' },
    { t:'Where would I actually reach you?' },
    { t:'What would stop you joining?' }
  ]}
];

/* Routing the question, crudely on purpose — a real one would use the model.
   Order matters: a statement is a line of copy, a question is about them. */
function classify(text){
  var t = text.toLowerCase().trim();
  var asks = /\?/.test(t) || /^(what|who|where|why|how|when|which|do|does|did|are|is|would|could|can|tell me|describe)\b/.test(t);

  // explicit, whatever the shape
  if (/^["“']/.test(text.trim()) || /\b(copy|tagline|slogan|headline|rewrite|creative|this line|this ad)\b/.test(t)) return 'copy';
  // a statement rather than a question is something to react to
  if (!asks) return 'copy';

  if (/\b(who are you|household|income|demographic|how old|age|family|kids|children|where do you live)\b/.test(t)) return 'demographics';
  if (/\b(typical (day|week)|your (week|weekend|day)|weekend|routine|how often|when do you|a day in|shopping trip)\b/.test(t)) return 'routine';
  if (/\b(switch|motivat|make you|convince|move you|why would you|what would you)\b/.test(t)) return 'motivation';
  if (/\b(reach|media|channel|see (an )?ad|advertis|billboard|radio|social|catalogue)\b/.test(t)) return 'channel';
  if (/\b(stop|barrier|objection|put you off|worry|concern|hesitat|why wouldn)\b/.test(t)) return 'objection';
  return 'general';
}

/* ── state ───────────────────────────────────────────────────────────────── */
var mode = 'lumos', audiencesReady = true;
var rail = document.getElementById('rail'), thread = document.getElementById('thread'),
    room = document.getElementById('room'), input = document.getElementById('input'),
    seg = document.getElementById('seg'), lockNote = document.getElementById('lockNote'),
    hint = document.getElementById('hint'), headT = document.getElementById('headT'),
    headS = document.getElementById('headS'), dState = document.getElementById('dState');

function add(html, delay) {
  var d = document.createElement('div'); d.className = 'fade'; d.innerHTML = html;
  thread.appendChild(d);
  setTimeout(function(){ d.classList.add('in'); thread.scrollTop = thread.scrollHeight; }, delay || 30);
  return d;
}
function initials(n){ return n.split(/\s+/).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase(); }
function active(){ return TWINS.filter(function(t){ return t.on; }); }

function paintRoom(){
  room.innerHTML = '<span class="room-k">Select</span>' + TWINS.map(function(t){
    return '<button class="tw' + (t.on ? '' : ' off') + '" data-t="' + t.id + '">' +
      '<span class="av" style="background:' + t.c + '">' + initials(t.n) + '</span>' +
      '<span><b>' + t.n + '</b><span>' + t.sub + '</span></span></button>';
  }).join('');
  room.querySelectorAll('.tw').forEach(function(b){
    b.onclick = function(){
      var t = TWINS.filter(function(x){ return x.id === b.dataset.t; })[0];
      if (t.on && active().length === 1) return;      // never empty the room
      t.on = !t.on; paintRoom(); paintMode();   // the header counts who is listening
    };
  });
}

function paintMode(){
  rail.classList.toggle('twin', mode === 'twin');
  seg.querySelectorAll('button').forEach(function(b){
    b.classList.toggle('on', b.dataset.mode === mode);
    if (b.dataset.mode === 'twin') b.disabled = !audiencesReady;
  });
  headT.textContent = mode === 'twin' ? 'Ask the digital twins' : 'Ask Lumos';
  headS.textContent = mode === 'twin'
    ? active().length + ' of 3 twins in the room · Costco — Western Sydney'
    : 'Costco — Western Sydney launch';
  lockNote.innerHTML = audiencesReady ? '' : 'Available once audiences are identified';
  input.placeholder = mode === 'twin'
    ? 'Paste a line of copy, or ask the twins a question…'
    : 'Reply to Lumos';
  hint.textContent = mode === 'twin'
    ? 'Answers come from the audiences, grounded in their behaviour'
    : '';
  dState.textContent = 'audiences: ' + (audiencesReady ? 'identified' : 'not yet') + ' · mode: ' + mode;
}

/* ── the twin exchange ───────────────────────────────────────────────────── */
function askTwins(text){
  var kind = classify(text);
  var A = ANSWERS[kind] || ANSWERS.general;
  add('<div class="user"><span>' + text + '</span></div>', 20);
  add('<div class="sys"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>' +
      '<p>' + A.label + ' — across <b>' + active().length + ' twins</b>.</p></div>', 260);

  active().forEach(function(t, i){
    var a = A[t.id]; if (!a) return;
    setTimeout(function(){
      var scored = A.scored && typeof a.score === 'number';
      var el = add('<div class="reply">' +
        '<div class="rh"><span class="av" style="background:' + t.c + '">' + initials(t.n) + '</span>' +
        '<span><span class="nm">' + t.n + '</span><span class="sub">' + t.sub + '</span></span>' +
        (scored ? '<span class="score"><b style="color:' + t.c + '">' + a.score + '</b><span>Resonance</span></span>' : '') +
        '</div>' +
        (scored ? '<div class="meter"><i style="background:' + t.c + '"></i></div>' : '') +
        '<q>' + a.say + '</q>' +
        '<div class="why">' + a.why + '</div></div>', 20);
      if (scored) setTimeout(function(){
        var m = el.querySelector('.meter i'); if (m) m.style.width = a.score + '%';
      }, 120);
    }, 900 + i * 850);
  });

  setTimeout(function(){
    promptLibrary('Ask them something else', 40);
  }, 900 + active().length * 850 + 400);
}

/* the library is always one click away, and never the only way in */
function promptLibrary(title, delay){
  var el = add('<div class="lib"><div class="lib-h">' + title + '</div>' +
    PROMPTS.map(function(g){
      return '<div class="lib-g"><div class="lib-k">' + g.g + '</div><div class="lib-r">' +
        g.items.map(function(it){
          return '<button data-s="' + it.t.replace(/"/g,'&quot;') + '">' + it.t +
            (it.hint ? '<span class="lib-hint">' + it.hint + '</span>' : '') + '</button>';
        }).join('') + '</div></div>';
    }).join('') +
    '<div class="lib-f">Or ask anything — they answer from their own behaviour.</div></div>', delay || 40);
  el.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){ input.value = b.dataset.s; input.focus(); };
  });
}

function send(){
  var v = input.value.trim(); if (!v) return;
  input.value = '';
  if (mode === 'twin') askTwins(v);
  else {
    add('<div class="user"><span>' + v + '</span></div>', 20);
    add('<div class="ai">I can answer that from the analysis — or switch to <b>Ask the twins</b> and put it to the audiences directly.</div>', 260);
  }
}
document.getElementById('send').onclick = send;
input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); });

seg.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.mode === mode) return;
  mode = b.dataset.mode;
  paintMode();
  if (mode === 'twin') {
    add('<div class="sys"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17.5" cy="9" r="2.4"/></svg></span>' +
        '<p>You’re now talking to the <b>three digital twins</b> Lumos built. Ask them anything — about their households, their week, what would move them, or paste a line of copy to test.</p></div>', 30);
    promptLibrary('Try asking', 220);
  } else {
    add('<div class="sys" style="border-color:var(--line2)"><span class="ic" style="background:var(--lilac3)">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="#6B3C72" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' +
        '<p>Back to <b>Ask Lumos</b>.</p></div>', 30);
  }
});

/* ── the conversation that has already happened ──────────────────────────── */
function seed(){
  thread.innerHTML = '';
  add('<div class="user"><span>Yes, proceed with this segmentation</span></div>', 20);
  add('<div class="ai">Full analysis done. Here are the three Costco launch audiences I’ve built — Marsden Park Stock-Ups, Parramatta Value Families and Castle Hill Bulk Buyers.</div>', 160);
  add('<div class="ai">You can keep asking me about them — or talk to them directly. <b>Ask the twins</b> is now available beside the composer.</div>', 320);
}

document.getElementById('dAud').onclick = function(){
  audiencesReady = !audiencesReady;
  if (!audiencesReady && mode === 'twin') { mode = 'lumos'; }
  paintMode();
};
document.getElementById('dReset').onclick = function(){
  mode = 'lumos'; audiencesReady = true;
  TWINS.forEach(function(t){ t.on = true; });
  paintRoom(); paintMode(); seed(); input.value = '';
};

paintRoom(); paintMode(); seed();
</script>
