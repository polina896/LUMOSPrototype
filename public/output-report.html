<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--plum:#4A2A6E;--plum2:#6B3C72;--violet:#7C4FC7;--ink:#1A1A1A;--ink2:#4A3E5C;
        --muted:#7E7490;--muted2:#A79FB6;--line:#EBE5F1;--line2:#E1D9EC;--lilac:#EFE8F8;--lilac3:#F5F0FB;
        --disp:"Baloo 2",system-ui,sans-serif;--body:"Nunito",system-ui,sans-serif;--chat:"Jua",system-ui,sans-serif}
  body{font-family:var(--body);color:var(--ink);background:#F7F6F9}
  /* ── Lumos brand band ─────────────────────────────────────────────────────
     The page is sent outside the tool, so it should look like it came from
     somewhere. Deep purple, the dot field from the site, the wordmark and the
     line the site leads with. */

  .brandbar::before{content:"";position:absolute;inset:0;

  .wordmark{font-family:var(--body);font-style:italic;font-weight:800;font-size:19px;letter-spacing:-.005em;color:#fff;line-height:1}

  .brandbar .cta{margin-left:auto;flex:0 0 auto;font-family:var(--disp);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;

  .finds li i{width:15px;height:15px;border-radius:50%;background:#1F7A4C;flex:0 0 auto;margin-top:2px;display:grid;place-items:center}

  .plan{display:flex;flex-direction:column;gap:0;margin:14px 0}
  .prow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .prow .wk{font-family:var(--disp);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--plum2);width:88px;flex:0 0 auto;padding-top:2px}
  .prow .bar{height:9px;border-radius:99px;background:var(--lilac);position:relative;flex:1;min-width:80px;margin-top:4px;overflow:hidden}

  @media (max-width:720px){ .prow{flex-wrap:wrap} .prow .lbl{width:100%} }

  .tt{position:fixed;z-index:900;background:#211A2E;color:#fff;border-radius:9px;padding:7px 10px;font-family:var(--body);font-size:11.5px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .tt.show{opacity:1}
  .tt em{display:block;font-style:normal;font-weight:600;color:#C9BEF0;font-size:10.5px;margin-top:2px}
  .leaflet-container{background:#E8E6EF;font-family:var(--body)}
  .maplink{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid var(--line2);border-radius:12px;text-decoration:none;color:var(--ink);transition:.15s;background:#fff}

  .maplink .ic svg{width:15px;height:15px;color:var(--plum2)}
  .maplink b{font-family:var(--disp);font-size:13px;display:block}
  .maplink span{font-size:11.5px;color:var(--muted)}
  .maplink .go{margin-left:auto;font-family:var(--disp);font-size:12px;font-weight:700;color:var(--plum2)}
</style>

<script>
/* ══ chart toolkit ═══════════════════════════════════════════════════════════
   Emphasis is the default form: the audience carries the accent hue, the metro
   baseline is the de-emphasis gray. Ordered scales use the one-hue ramp.       */
const TT=document.getElementById('tt');
function tipOn(el,html){
  el.addEventListener('mousemove',e=>{ TT.innerHTML=html; TT.classList.add('show');
    TT.style.left=Math.min(window.innerWidth-TT.offsetWidth-12,e.clientX+14)+'px';
    TT.style.top=(e.clientY-TT.offsetHeight-12)+'px'; });
  el.addEventListener('mouseleave',()=>TT.classList.remove('show'));
}
const SVGNS='http://www.w3.org/2000/svg';
function el(n,a){ const x=document.createElementNS(SVGNS,n); for(const k in a) x.setAttribute(k,a[k]); return x; }
// column with a 4px rounded cap, square at the baseline
function colPath(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function barPath(x,y,w,h,r){   // horizontal: rounded at the data end only
  r=Math.min(r,h/2,w);
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
}
// columns, with optional second series (grouped) — 2px surface gap, ≤24px thick
function columns(host,{data,max,fmt,series,labelEvery}){
  const W=host.clientWidth||300, H=118, padB=20, padT=16, n=data.length;
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,class:'chart'});
  const plotH=H-padB-padT, band=W/n, two=!!series;
  svg.appendChild(el('line',{x1:0,y1:H-padB,x2:W,y2:H-padB,stroke:'var(--grid)','stroke-width':1}));
  data.forEach((d,i)=>{
    const vals=two?[d.a,d.b]:[d.v];
    const thick=Math.min(24,(band-10)/(two?2:1)-(two?2:0));
    vals.forEach((v,k)=>{
      const h=Math.max(2,(v/max)*plotH);
      const gx=band*i+(band-(thick*(two?2:1)+(two?2:0)))/2+k*(thick+2);
      const fill=two?(k===0?'var(--acc)':'var(--ctx)'):(d.fill||'var(--acc)');
      const p=el('path',{d:colPath(gx,H-padB-h,thick,h,4),fill});
      tipOn(p, `${d.label} · ${fmt(v)}<em>${two?(k===0?series[0]:series[1]):(d.note||'')}</em>`);
      svg.appendChild(p);
      if(d.tag && k===0){
        const t=el('text',{x:gx+thick/2,y:H-padB-h-6,'text-anchor':'middle','font-size':10.5,'font-weight':700,fill:'#4A3E5C','font-family':'Baloo 2, sans-serif'});
        t.textContent=fmt(v); svg.appendChild(t);
      }
    });
    if(!labelEvery || i%labelEvery===0){
      const lb=el('text',{x:band*i+band/2,y:H-6,'text-anchor':'middle','font-size':10,fill:'#7E7490','font-family':'Nunito, sans-serif','font-weight':600});
      lb.textContent=d.label; svg.appendChild(lb);
    }
  });
  host.appendChild(svg);
}
// two horizontal bars: the audience against the metro baseline
function pairBars(host,{rows,max,fmt}){
  const W=host.clientWidth||300, rowH=30, H=rows.length*rowH+6;
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,class:'chart'});
  const labelW=74, barW=W-labelW-46;
  rows.forEach((r,i)=>{
    const y=i*rowH+4, h=16;
    const lb=el('text',{x:0,y:y+h-3,'font-size':11,fill:'#4A3E5C','font-family':'Nunito, sans-serif','font-weight':700});
    lb.textContent=r.label; svg.appendChild(lb);
    svg.appendChild(el('rect',{x:labelW,y:y+1,width:barW,height:h-2,rx:4,fill:'#F4F1F7'}));
    const w=Math.max(3,(r.v/max)*barW);
    const p=el('path',{d:barPath(labelW,y,w,h,4),fill:r.ctx?'var(--ctx)':'var(--acc)'});
    tipOn(p,`${r.label} · ${fmt(r.v)}<em>${r.note||''}</em>`); svg.appendChild(p);
    const vt=el('text',{x:labelW+w+8,y:y+h-3,'font-size':11,'font-weight':700,fill:'#4A3E5C','font-family':'Baloo 2, sans-serif'});
    vt.textContent=fmt(r.v); svg.appendChild(vt);
  });
  host.appendChild(svg);
}



/* ── figures ─────────────────────────────────────────────────────────────── */
var RAMP=['#D6B9DA','#B084B8','#7A4C82','#4E2A54'], ACC='#6B3C72', CTX='#8A8494';

function figure(host, opts){
  var f=document.createElement('div');
  f.className='fig'+(opts.map?' map':'');
  f.innerHTML='<div class="fig-h"><b>'+opts.t+'</b><span>'+(opts.sub||'')+'</span>'+
    (opts.legend?'<span class="lg">'+opts.legend.map(function(l){return '<span><i style="background:'+l[0]+'"></i>'+l[1]+'</span>';}).join('')+'</span>':'')+
    '</div><div class="fig-b"></div>'+(opts.cap?'<div class="fig-cap">'+opts.cap+'</div>':'');
  host.appendChild(f);
  if (opts.draw) opts.draw(f.querySelector('.fig-b'));
  return f;
}

var FIGURES = {
  distance:function(host){ figure(host,{ t:'How far they travel', sub:'share of trips by distance band',
    legend:[[RAMP[0],'Nearer'],[RAMP[3],'Further']],
    cap:'Median <b>14 km</b> against a metro average of 8.4 km — two thirds of trips begin beyond 10 km.',
    draw:function(b){ columns(b,{max:44,fmt:function(v){return v+'%';},labelEvery:1,data:[
      {label:'≤5 km',v:12,fill:RAMP[0]},{label:'5–10',v:24,fill:RAMP[1]},
      {label:'10–15',v:24,fill:RAMP[2]},{label:'15+ km',v:40,fill:RAMP[3],tag:1}]}); }}); },

  week:function(host){ figure(host,{ t:'When they shop', sub:'share of visits by day',
    legend:[[ACC,'Weekend'],[CTX,'Weekday']],
    cap:'<b>57%</b> of visits fall on a Saturday or Sunday — the metro grocery average is 41%.',
    draw:function(b){ columns(b,{max:36,fmt:function(v){return v+'%';},labelEvery:1,data:[
      {label:'Mon',v:7,fill:CTX},{label:'Tue',v:7,fill:CTX},{label:'Wed',v:8,fill:CTX},
      {label:'Thu',v:9,fill:CTX},{label:'Fri',v:12,fill:CTX},
      {label:'Sat',v:33,fill:ACC,tag:1},{label:'Sun',v:24,fill:ACC}]}); }}); },

  origins:function(host){ figure(host,{ t:'Where the trips begin', sub:'share of trips by origin suburb',
    cap:'<b>Penrith, Richmond and Castle Hill</b> send just over half the trips — three outer centres with no warehouse club of their own.',
    draw:function(b){ pairBars(b,{max:22,fmt:function(v){return v+'%';},rows:[
      {label:'Penrith',v:20},{label:'Richmond',v:18},{label:'Castle Hill',v:14},
      {label:'Schofields',v:7,ctx:1},{label:'Blacktown',v:7,ctx:1}]}); }}); },

  overlap:function(host){ figure(host,{ t:'Where else they shop', sub:'visited in the last 90 days',
    legend:[[ACC,'This audience'],[CTX,'Metro average']],
    cap:'IKEA <b>3.4×</b> and Bunnings <b>2.9×</b> the metro rate — and usually on the same trip.',
    draw:function(b){ pairBars(b,{max:60,fmt:function(v){return v+'%';},rows:[
      {label:'IKEA',v:41},{label:'IKEA · metro',v:12,ctx:1},
      {label:'Bunnings',v:56},{label:'Bunnings · metro',v:19,ctx:1}]}); }}); },

  competitors:function(host){ figure(host,{ t:'Share of basket today', sub:'and how movable each is',
    legend:[['#2F8F63','Share held'],[CTX,'Switching propensity']],
    cap:'The mismatch is the opportunity — <b>ALDI holds less but moves more</b>.',
    draw:function(b){ pairBars(b,{max:36,fmt:function(v){return v+'%';},rows:[
      {label:'Woolworths',v:34},{label:'· switching',v:11,ctx:1},
      {label:'ALDI',v:24},{label:'· switching',v:14,ctx:1}]}); }}); },

  channels:function(host){ figure(host,{ t:'Recommended weighting', sub:'share of working budget',
    cap:'Weighted to the trip rather than the household — two thirds of trips begin beyond 10 km.',
    draw:function(b){ pairBars(b,{max:48,fmt:function(v){return v+'%';},rows:[
      {label:'Roadside OOH',v:45},{label:'Digital & social',v:30},
      {label:'Drive-time radio',v:15},{label:'Catalogue',v:10,ctx:1}]}); }}); },

  kpis:function(host){
    var d=document.createElement('div'); d.className='kpis';
    d.innerHTML=[['566k','HOUSEHOLDS IN SCOPE'],['14 km','MEDIAN TRIP · 1.7× METRO'],
