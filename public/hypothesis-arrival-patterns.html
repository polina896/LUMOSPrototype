<meta charset="utf-8">
<title>Hypothesis arrival — four non-disruptive patterns</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --plum:#4A2A6E; --plum2:#6B3C72; --violet:#7C4FC7; --deep:#4E2A54;
    --ink:#1A1A1A; --ink2:#4A3E5C; --muted:#7E7490; --muted2:#A79FB6;
    --line:#EBE5F1; --line2:#E1D9EC; --lilac:#EFE8F8; --lilac3:#F5F0FB;
    --amber:#B45309; --amberbg:#FEF6E7; --amberline:#F0D9A8;
    --disp:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --chat:"Jua",system-ui,sans-serif;
  }
  body{font-family:var(--body);color:var(--ink);height:100vh;overflow:hidden;background:#fff}
  .wrap{display:flex;flex-direction:column;height:100vh}

  /* ── control strip ─────────────────────────────────────────────────────── */
  .ctrl{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--lilac3);flex:0 0 auto;flex-wrap:wrap}
  .ctrl .lbl{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2);margin-right:2px}
  .opt{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line2);border-radius:99px;background:#fff;cursor:pointer;transition:.15s;font-family:var(--disp);font-size:12px;font-weight:700;color:var(--ink2)}
  .opt:hover{border-color:var(--violet);color:var(--plum2)}
  .opt.on{background:var(--plum2);border-color:var(--plum2);color:#fff}
  .opt .n{width:17px;height:17px;border-radius:50%;background:var(--lilac);color:var(--plum2);display:grid;place-items:center;font-size:10px;font-weight:800}
  .opt.on .n{background:rgba(255,255,255,.25);color:#fff}
  .go{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{font-family:var(--disp);font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:10px;border:none;cursor:pointer;transition:.15s;background:var(--plum2);color:#fff}
  .btn:hover{background:var(--plum)}
  .btn.ghost{background:#fff;border:1px solid var(--line2);color:var(--ink2)}
  .btn.ghost:hover{border-color:var(--violet);color:var(--plum2)}

  .body{flex:1;display:flex;min-height:0}

  /* ── chat ──────────────────────────────────────────────────────────────── */
  .rail{width:440px;flex:0 0 440px;border-right:1px solid #e5e5e2;display:flex;flex-direction:column;min-height:0;position:relative}
  .rail-h{padding:13px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .spark{width:22px;height:22px;border-radius:7px;background:var(--plum2);display:grid;place-items:center}
  .spark svg{width:12px;height:12px;fill:#fff}
  .brand{font-family:var(--disp);font-weight:700;font-size:14px}
  /* pattern 3 lives here */
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--disp);font-size:11px;font-weight:700;color:var(--muted);opacity:0;transition:.3s;cursor:default}
  .status.show{opacity:1}
  .status.ready{color:var(--amber);cursor:pointer}
  .status .pip{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
  .status.ready .pip{background:var(--amber);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,83,9,.45)}70%{box-shadow:0 0 0 7px rgba(180,83,9,0)}100%{box-shadow:0 0 0 0 rgba(180,83,9,0)}}

  .thread{flex:1;overflow-y:auto;padding:20px 22px 8px;min-height:0}
  .user{display:flex;justify-content:flex-end;margin-bottom:16px}
  .user span{max-width:85%;background:#e7e7e7;border-radius:12px 12px 0 12px;padding:10px 14px;font-family:var(--chat);font-size:14px;opacity:.7;line-height:1.5}
  .ai{font-family:var(--chat);font-size:15px;color:#140934;line-height:1.6;margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:99px;border:1px solid #7A4C8244;background:#7A4C8212;color:#7A4C82;font-family:var(--disp);font-size:11px;font-weight:700;margin-bottom:10px}
  .chip i{width:17px;height:17px;border-radius:50%;background:#7A4C82;display:grid;place-items:center}
  .chip i svg{width:10px;height:10px}
  .fade{opacity:0;transform:translateY(9px);transition:.45s cubic-bezier(.22,1,.36,1)}
  .fade.in{opacity:1;transform:none}

  /* ── the hypothesis, collapsed and open ────────────────────────────────── */
  .hyp{border:1px solid var(--amberline);background:var(--amberbg);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .hyp-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:.15s}
  .hyp-head:hover{background:rgba(255,255,255,.5)}
  .hyp-ic{width:26px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--amberline);display:grid;place-items:center;flex:0 0 auto}
  .hyp-ic svg{width:14px;height:14px;stroke:var(--amber)}
  .hyp-t{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--amber);line-height:1.35}
  .hyp-t small{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;color:#8a6a3a;margin-top:2px}
  .hyp-chev{margin-left:auto;color:var(--amber);transition:transform .2s;flex:0 0 auto}
  .hyp.open .hyp-chev{transform:rotate(180deg)}
  .hyp-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.22,1,.36,1)}
  .hyp.open .hyp-body{max-height:340px}
  .hyp-inner{padding:0 14px 14px}
  .hyp-quote{background:#fff;border:1px solid var(--amberline);border-radius:11px;padding:12px 14px;margin-bottom:12px}
  .hyp-quote .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  .hyp-quote p{font-family:var(--chat);font-size:14px;line-height:1.6;color:#3a2a12}
  .hyp-ask{font-family:var(--chat);font-size:14px;color:#3a2a12;margin-bottom:11px}
  .hyp-acts{display:flex;gap:9px}
  .hyp-acts button{font-family:var(--disp);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;border:none;transition:.15s}
  .hyp-yes{background:var(--amber);color:#fff}
  .hyp-yes:hover{background:#93400a}
  .hyp-no{background:#fff;border:1px solid var(--amberline)!important;color:#8a6a3a}

  /* pattern 1 helper: jump-to-new */
  .jump{position:absolute;left:50%;transform:translateX(-50%) translateY(8px);bottom:118px;z-index:40;display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;background:var(--amber);color:#fff;font-family:var(--disp);font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(180,83,9,.35);cursor:pointer;opacity:0;pointer-events:none;transition:.3s}
  .jump.show{opacity:1;transform:translateX(-50%);pointer-events:auto}

  /* pattern 2: docked above the composer */
  .dock{margin:0 22px 10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--amberline);background:var(--amberbg);border-radius:12px;cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:.35s cubic-bezier(.22,1,.36,1)}
  .dock.show{opacity:1;transform:none;pointer-events:auto}
  .dock:hover{background:#fdf0d9}
  .dock .d-ic{width:24px;height:24px;border-radius:7px;background:#fff;border:1px solid var(--amberline);display:grid;place-items:center;flex:0 0 auto}
  .dock .d-ic svg{width:13px;height:13px;stroke:var(--amber)}
  .dock .d-t{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--amber);line-height:1.35}
  .dock .d-t small{display:block;font-family:var(--body);font-weight:600;font-size:11px;color:#8a6a3a;margin-top:1px}
  /* the chosen pattern: docked strip + a pulsing open button, mirrored on the map */
  .dock .d-open{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:none;
    background:var(--amber);color:#fff;font-family:var(--disp);font-size:11.5px;font-weight:800;cursor:pointer;
    animation:openpulse 2s ease-out infinite;transition:background .15s}
  .dock .d-open:hover{background:#93400a;animation:none}
  .dock .d-open svg{width:12px;height:12px;stroke:#fff}
  @keyframes openpulse{0%{box-shadow:0 0 0 0 rgba(180,83,9,.5)}70%{box-shadow:0 0 0 11px rgba(180,83,9,0)}100%{box-shadow:0 0 0 0 rgba(180,83,9,0)}}
  .dock .d-x{margin-left:6px;color:#b99a6a;font-size:15px;line-height:1;padding:0 2px;cursor:pointer}

  .composer{padding:0 22px 18px;flex:0 0 auto}
  .cbox{border:1px solid #ccc;border-radius:11px;padding:12px 14px;transition:.15s}
  .cbox:focus-within{border-color:var(--plum2);box-shadow:0 0 0 3px rgba(107,60,114,.1)}
  .cbox textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--chat);font-size:14px;line-height:1.5;color:#000;min-height:38px}
  .cbox textarea::placeholder{color:#aaa}
  .crow{display:flex;align-items:center;gap:10px;margin-top:6px}
  .crow .send{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#4d6bf0;display:grid;place-items:center;cursor:pointer}
  .crow .send svg{width:15px;height:15px;stroke:#fff}
  .typing{font-family:var(--body);font-size:11px;color:var(--muted2);font-weight:600}

  /* ── map ───────────────────────────────────────────────────────────────── */
  .stage{flex:1;position:relative;min-width:0;background:#E8E6EF}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#E8E6EF;font-family:var(--body)}
  /* pattern 4: the badge on the map */
  .mbadge{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:99px;background:#fff;border:1px solid var(--amberline);box-shadow:0 4px 18px rgba(180,83,9,.28);cursor:pointer;width:max-content;transform:translate(-50%,-50%);opacity:0;transition:.4s cubic-bezier(.22,1,.36,1);pointer-events:none}
  .mbadge.show{opacity:1;pointer-events:auto}
  .mbadge:hover{background:#fffaf0}
  .mbadge .b-ic{width:22px;height:22px;border-radius:50%;background:var(--amberbg);display:grid;place-items:center;flex:0 0 auto;animation:pulse 1.8s ease-out infinite}
  .mbadge .b-ic svg{width:12px;height:12px;stroke:var(--amber)}
  .mbadge .b-t{font-family:var(--disp);font-size:11.5px;font-weight:800;color:var(--amber);white-space:nowrap}
  .ringlab{width:max-content;font-family:var(--disp);font-weight:800;font-size:10.5px;color:#fff;background:var(--deep);border-radius:99px;padding:3px 9px;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 0 0 1.6px rgba(255,255,255,.92),0 3px 10px rgba(33,26,46,.34)}
  .note{position:absolute;left:16px;bottom:16px;z-index:600;width:290px;padding:13px 15px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(33,26,46,.07),0 18px 44px rgba(74,42,110,.14)}
  .note .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--plum2);margin-bottom:7px}
  .note p{font-size:12px;color:var(--ink2);line-height:1.55}
  .note b{color:var(--plum)}
  /* ── "what just happened" spotlight ─────────────────────────────────────── */
  .spot{position:fixed;z-index:900;border:2px dashed var(--amber);border-radius:14px;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(26,16,48,.13);opacity:0;transition:.4s cubic-bezier(.22,1,.36,1)}
  .spot.show{opacity:1}
  .spot-lab{position:fixed;z-index:901;display:flex;align-items:center;gap:8px;padding:8px 13px 8px 9px;border-radius:99px;
    background:var(--amber);color:#fff;font-family:var(--disp);font-size:12px;font-weight:800;white-space:nowrap;
    box-shadow:0 6px 22px rgba(180,83,9,.4);opacity:0;transform:translateY(6px);transition:.4s cubic-bezier(.22,1,.36,1);pointer-events:none}
  .spot-lab.show{opacity:1;transform:none}
  .spot-lab .n{width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:10.5px}
  .diff{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  .diff .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
  .drow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
  .drow:last-child{margin-bottom:0}
  .drow .v{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:11px}
  .drow .v.no{color:#2F8F63}
  .drow .v.yes{color:var(--amber)}
</style>

<div class="wrap">
  <div class="ctrl">
    <span class="lbl">Arrival pattern</span>
    <div class="opt on" data-p="inline"><span class="n">1</span>Quiet inline card</div>
    <div class="opt" data-p="dock"><span class="n">2</span>Docked above composer</div>
    <div class="opt" data-p="status"><span class="n">3</span>Header status</div>
    <div class="opt" data-p="map"><span class="n">4</span>On the map</div>
    <div class="go">
      <button class="btn ghost" id="reset">Reset</button>
      <button class="btn" id="fire">Lumos finds the pattern →</button>
    </div>
  </div>

  <div class="body">
    <div class="rail">
      <div class="rail-h">
        <span class="spark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
        <span class="brand">Ask Lumos</span>
        <div class="status" id="status"><span class="pip"></span><span id="statusText">Looking for patterns…</span></div>
      </div>

      <div class="thread" id="thread"></div>
      <div class="jump" id="jump">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Lumos found a pattern
      </div>

      <div class="dock" id="dock">
        <span class="d-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
        <span class="d-t">Lumos spotted a pattern<small>Destination shopping · 20–30 km</small></span>
        <button class="d-open" id="dockOpen">Open<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <span class="d-x" id="dockX">×</span>
      </div>

      <div class="composer">
        <div class="cbox">
          <textarea id="input" rows="1" placeholder="Reply to Lumos — try typing while the pattern lands…"></textarea>
          <div class="crow">
            <span class="typing" id="typing"></span>
            <span class="send"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </div>
        </div>
      </div>
    </div>

    <div class="stage">
      <div id="map"></div>
      <div class="note">
        <div class="k">What this pattern does</div>
        <p id="noteText"></p>
        <div class="diff" id="diffBox" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── map ─────────────────────────────────────────────────────────────────── */
const STORE=[-33.7080,150.8450];
const map=L.map('map',{zoomControl:true,attributionControl:false,scrollWheelZoom:true}).setView([-33.720,150.880],10.6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'markerPane',opacity:.9}).addTo(map);
function rng(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
[[-33.7100,150.8730,26],[-33.6790,150.8580,20],[-33.7710,150.9060,24],[-33.7510,150.6940,30],
 [-33.5990,150.7510,26],[-33.7320,151.0050,28]].forEach((o,i)=>{
  const rr=rng(i*53+7);
  for(let k=0;k<o[2];k++){ const a=rr()*Math.PI*2,d=Math.sqrt(rr())*0.018;
    L.circleMarker([o[0]+Math.sin(a)*d*0.82,o[1]+Math.cos(a)*d],{radius:3,stroke:false,fillColor:'#7A4C82',fillOpacity:.45,interactive:false}).addTo(map); }
});
// the 20–30 km band the hypothesis is about
[20,30].forEach(km=>{
  L.circle(STORE,{radius:km*1000,color:'#5A2E62',weight:1.4,opacity:.5,dashArray:'6 7',fill:false,interactive:false}).addTo(map);
  L.marker([STORE[0]+(km/111)*0.82,STORE[1]],{interactive:false,icon:L.divIcon({html:`<div class="ringlab">${km} km</div>`,className:'',iconSize:[1,1]})}).addTo(map);
});
L.circleMarker(STORE,{radius:9,color:'#fff',weight:3,fillColor:'#4A2A6E',fillOpacity:1,interactive:false}).addTo(map);
// pattern 4's badge sits on the band it is talking about
const badgeMk=L.marker([-33.688,150.700],{interactive:true,icon:L.divIcon({className:'',iconSize:[1,1],
  html:`<div class="mbadge" id="mbadge"><span class="b-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span><span class="b-t">Pattern spotted here</span></div>`})}).addTo(map);

/* ── make the difference between the four legible, not just felt ─────────── */
const spot=document.createElement('div'); spot.className='spot'; document.body.appendChild(spot);
const spotLab=document.createElement('div'); spotLab.className='spot-lab'; document.body.appendChild(spotLab);
let spotTimer=null;
function spotlight(el,num,label){
  if(!el) return;
  clearTimeout(spotTimer);
  const r=el.getBoundingClientRect(), pad=7;
  spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px';
  spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
  spotLab.innerHTML=`<span class="n">${num}</span>${label}`;
  spotLab.style.left=Math.max(12,r.left-pad)+'px';
  spotLab.style.top=Math.max(12,r.top-pad-40)+'px';
  requestAnimationFrame(()=>{ spot.classList.add('show'); spotLab.classList.add('show'); });
  spotTimer=setTimeout(clearSpot,5200);
}
function clearSpot(){ spot.classList.remove('show'); spotLab.classList.remove('show'); }
document.addEventListener('click',(e)=>{ if(!e.target.closest('.ctrl')) clearSpot(); },true);

// a measured read of what the arrival actually cost the user
function diffPanel(rows){
  const el=document.getElementById('diffBox'); if(!el) return;
  el.innerHTML='<div class="k">What just happened</div>'+rows.map(r=>
    `<div class="drow"><span>${r[0]}</span><span class="v ${r[2]}">${r[1]}</span></div>`).join('');
  el.style.display='block';
}

/* ── patterns ────────────────────────────────────────────────────────────── */
const PATTERNS={
  inline:{ note:'The card <b>inserts itself into the thread</b> where it happened, collapsed to one line. It never steals your scroll — if you are reading further up or mid-sentence, a <b>“Lumos found a pattern”</b> pill appears instead and the thread stays exactly where you left it.' },
  dock:{ note:'The thread is <b>never touched</b>. A quiet strip docks above the composer, out of the conversation entirely, and waits. Opening it drops the hypothesis into the thread at the moment you asked for it — so the transcript stays honest.' },
  status:{ note:'The most ambient option. A status line in the header shifts from <b>“Looking for patterns…”</b> to <b>“1 pattern found”</b>. Nothing moves, nothing appears. Costs the least attention — and is the easiest to miss in a live demo.' },
  map:{ note:'The hypothesis is about <b>a place</b>, so it announces itself there — a pulsing badge out on the 20–30 km band. Zero chat disruption, and it teaches the user that the map is a surface for findings, not just a picture.' }
};
let pattern='inline';
const thread=document.getElementById('thread'), jump=document.getElementById('jump'),
      dock=document.getElementById('dock'), status=document.getElementById('status'),
      statusText=document.getElementById('statusText'), noteText=document.getElementById('noteText'),
      input=document.getElementById('input'), typing=document.getElementById('typing');

function add(html,delay){
  const d=document.createElement('div'); d.className='fade'; d.innerHTML=html; thread.appendChild(d);
  setTimeout(()=>d.classList.add('in'),delay||30);
  return d;
}
const atBottom = () => thread.scrollHeight - thread.scrollTop - thread.clientHeight < 60;
const busy = () => document.activeElement===input && input.value.trim().length>0;

const HYP_HTML = (open) => `
  <div class="hyp ${open?'open':''}">
    <div class="hyp-head">
      <span class="hyp-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
      <span class="hyp-t">I think we’ve identified an interesting pattern.<small>Destination shopping behaviour · 20–30 km</small></span>
      <svg class="hyp-chev" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="hyp-body"><div class="hyp-inner">
      <div class="hyp-quote">
        <div class="k">Hypothesis</div>
        <p>Costco’s strongest customers aren’t concentrated around the store — they’re willing to travel 20–30 km because they exhibit <b>destination shopping behaviour</b>.</p>
      </div>
      <div class="hyp-ask">Would you like me to validate this?</div>
      <div class="hyp-acts">
        <button class="hyp-yes">Validate this</button>
        <button class="hyp-no">Not now</button>
      </div>
    </div></div>
  </div>`;

function wireHyp(el){
  const card=el.querySelector('.hyp');
  el.querySelector('.hyp-head').onclick=()=>card.classList.toggle('open');
  el.querySelector('.hyp-yes').onclick=()=>{
    card.classList.remove('open');
    add(`<div class="user"><span>Yes — validate this</span></div>`,20);
    add(`<div class="ai">Testing it now. I’ll compare trip length and dwell time against a like-for-like grocery baseline, and check whether the 20–30 km households behave like destination shoppers on frequency and basket too.</div>`,320);
    setTimeout(()=>{ thread.scrollTop=thread.scrollHeight; },400);
  };
  el.querySelector('.hyp-no').onclick=()=>{ card.classList.remove('open'); };
}
function dropIntoThread(open){
  const el=add(HYP_HTML(open),30); wireHyp(el);
  requestAnimationFrame(()=>{ thread.scrollTop=thread.scrollHeight; });
  return el;
}

/* ── the arrival ─────────────────────────────────────────────────────────── */
function fire(){
  clear(false);
  const wasTop=thread.scrollTop, wasFocus=document.activeElement===input;
  if(pattern==='inline'){
    const el=add(HYP_HTML(false),30); wireHyp(el);
    const take=atBottom() && !busy();
    if(take) requestAnimationFrame(()=>thread.scrollTo({top:thread.scrollHeight,behavior:'smooth'}));
    else jump.classList.add('show');
    setTimeout(()=>{
      spotlight(take?el.querySelector('.hyp'):jump, 1, take?'Arrived inside the thread':'Thread untouched — pill offered instead');
      diffPanel([['Appeared in the thread','Yes','yes'],['Thread scrolled','+'+Math.round(thread.scrollTop-wasTop)+'px',take?'yes':'no'],
                 ['Typing interrupted',wasFocus&&document.activeElement!==input?'Yes':'No',wasFocus&&document.activeElement!==input?'yes':'no'],
                 ['Costs attention','Medium','yes']]);
    },520);
  }
  if(pattern==='dock'){ dock.classList.add('show'); document.getElementById('mbadge').classList.add('show');
    setTimeout(()=>{ spotlight(dock,2,'Docked above the composer — and pinned on the map'); diffPanel([['Appeared in the thread','No','no'],
      ['Thread scrolled','0px','no'],['Typing interrupted','No','no'],['Costs attention','Low','no']]); },420); }
  if(pattern==='status'){ status.classList.add('show','ready'); statusText.textContent='1 pattern found';
    setTimeout(()=>{ spotlight(status,3,'Header status only — nothing moved'); diffPanel([['Appeared in the thread','No','no'],
      ['Thread scrolled','0px','no'],['Typing interrupted','No','no'],['Costs attention','Very low — missable','no']]); },420); }
  if(pattern==='map'){ const mb=document.getElementById('mbadge'); mb.classList.add('show');
    setTimeout(()=>{ spotlight(mb,4,'Announced on the map, 22 km out'); diffPanel([['Appeared in the thread','No','no'],
      ['Thread scrolled','0px','no'],['Typing interrupted','No','no'],['Costs attention','Low — but off in the map','no']]); },420); }
}
jump.onclick=()=>{ jump.classList.remove('show'); thread.scrollTo({top:thread.scrollHeight,behavior:'smooth'}); const c=thread.querySelector('.hyp'); if(c) c.classList.add('open'); };
function openHypothesis(){
  dock.classList.remove('show');
  const mb=document.getElementById('mbadge'); if(mb) mb.classList.remove('show');   // the map notice clears too
  clearSpot(); dropIntoThread(true);
}
function dismissHypothesis(){ dock.classList.remove('show'); const mb=document.getElementById('mbadge'); if(mb) mb.classList.remove('show'); clearSpot(); }
dock.onclick=(e)=>{ if(e.target.closest('#dockX')){ dismissHypothesis(); return; } openHypothesis(); };
status.onclick=()=>{ if(!status.classList.contains('ready'))return; status.classList.remove('ready'); statusText.textContent='Looking for patterns…'; dropIntoThread(true); };
badgeMk.on('click',()=>openHypothesis());

/* ── seed conversation, so there is something to be interrupted ──────────── */
function clear(seed){
  jump.classList.remove('show'); dock.classList.remove('show');
  status.classList.remove('ready'); statusText.textContent='Looking for patterns…';
  const mb=document.getElementById('mbadge'); if(mb) mb.classList.remove('show');
  clearSpot(); const db=document.getElementById('diffBox'); if(db) db.style.display='none';
  if(seed!==false){
    thread.innerHTML='';
    add(`<span class="chip"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/></svg></i>Selected on map · Marsden Park · Riverstone</span>
      <div class="ai">This audience is 2.3× more likely to be affluent families with larger households. They frequently visit Bunnings, IKEA and Costco Auburn on weekends — big-basket trips, made by car.</div>`,30);
    add(`<div class="user"><span>How far do they travel?</span></div>`,120);
    add(`<div class="ai">A median of 14 km each way — 1.7× the Greater Sydney average of 8.4 km. Two thirds of trips come from beyond 10 km.</div>`,220);
    add(`<div class="user"><span>Which suburbs are they coming from?</span></div>`,320);
    add(`<div class="ai">Penrith, Richmond and Castle Hill alone send just over half the trips — three outer centres with no warehouse club of their own.</div>`,420);
    add(`<div class="user"><span>Which competitor are they switching from?</span></div>`,520);
    add(`<div class="ai">Mostly ALDI and Woolworths. ALDI holds a smaller share of basket but a far higher switching rate.</div>`,620);
    setTimeout(()=>{ thread.scrollTop=thread.scrollHeight; status.classList.add('show'); },700);
  }
}
document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); o.classList.add('on');
  pattern=o.dataset.p; noteText.innerHTML=PATTERNS[pattern].note; clear(true);
});
document.getElementById('fire').onclick=fire;
document.getElementById('reset').onclick=()=>clear(true);
input.addEventListener('input',()=>{ typing.textContent = input.value.trim() ? 'mid-sentence — Lumos will not steal your scroll' : ''; });
noteText.innerHTML=PATTERNS.inline.note; clear(true);
</script>
