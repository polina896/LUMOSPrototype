<meta charset="utf-8">
<title>Validate the hypothesis — evidence in chat, driving the map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --plum:#4A2A6E; --plum2:#6B3C72; --violet:#7C4FC7; --deep:#4E2A54;
    --ink:#1A1A1A; --ink2:#4A3E5C; --muted:#7E7490; --muted2:#A79FB6;
    --line:#EBE5F1; --line2:#E1D9EC; --lilac:#EFE8F8; --lilac3:#F5F0FB;
    --amber:#B45309; --amberbg:#FEF6E7; --amberline:#F0D9A8;
    /* chart tokens — emphasis pattern: one accent hue + a de-emphasis gray.
       Validated: ΔE 20.4 normal / 19.4 deutan, contrast ≥3:1 on this surface. */
    --acc:#6B3C72; --ctx:#8A8494;
    --s1:#EFE3F1; --s2:#D6B9DA; --s3:#B084B8; --s4:#7A4C82; --s5:#4E2A54;
    --surface:#fff; --grid:#EDEAF2;
    --disp:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --chat:"Jua",system-ui,sans-serif;
  }
  body{font-family:var(--body);color:var(--ink);height:100vh;overflow:hidden;background:#fff}
  .wrap{display:flex;flex-direction:column;height:100vh}

  .ctrl{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--lilac3);flex:0 0 auto}
  .ctrl .lbl{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2)}
  .seg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:#fff;border:1px solid var(--line2)}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-family:var(--disp);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button.on{background:var(--plum2);color:#fff}
  .ctrl .note{font-size:11.5px;color:var(--muted);margin-left:4px}
  .ctrl .go{margin-left:auto}
  .btn{font-family:var(--disp);font-size:12.5px;font-weight:700;padding:9px 15px;border-radius:10px;border:none;cursor:pointer;background:var(--plum2);color:#fff}
  .btn:hover{background:var(--plum)}

  .body{flex:1;display:flex;min-height:0}
  /* the layout shift: the chat takes the room the evidence needs */
  .rail{width:440px;flex:0 0 440px;border-right:1px solid #e5e5e2;display:flex;flex-direction:column;min-height:0;transition:flex-basis .6s cubic-bezier(.22,1,.36,1),width .6s cubic-bezier(.22,1,.36,1)}
  .body.wide .rail{width:62%;flex-basis:62%}
  .stage{flex:1;position:relative;min-width:0;background:#E8E6EF}

  .rail-h{padding:13px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .spark{width:22px;height:22px;border-radius:7px;background:var(--plum2);display:grid;place-items:center}
  .spark svg{width:12px;height:12px;fill:#fff}
  .brand{font-family:var(--disp);font-weight:700;font-size:14px}
  .thread{flex:1;overflow-y:auto;padding:20px 24px 20px;min-height:0}
  .user{display:flex;justify-content:flex-end;margin-bottom:16px}
  .user span{max-width:85%;background:#e7e7e7;border-radius:12px 12px 0 12px;padding:10px 14px;font-family:var(--chat);font-size:14px;opacity:.7;line-height:1.5}
  .ai{font-family:var(--chat);font-size:15px;color:#140934;line-height:1.6;margin-bottom:14px}
  .fade{opacity:0;transform:translateY(10px);transition:.5s cubic-bezier(.22,1,.36,1)}
  .fade.in{opacity:1;transform:none}

  /* ── evidence grid ─────────────────────────────────────────────────────── */
  .evgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px;align-items:start}
  .body.wide .evgrid{grid-template-columns:1fr 1fr}
  .ev{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:14px 15px 12px;display:flex;flex-direction:column}
  .ev.on{border-color:var(--plum2);box-shadow:0 2px 12px rgba(74,42,110,.13)}
  .ev-h{display:flex;align-items:flex-start;gap:9px;margin-bottom:2px}
  .ev-t{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
  .ev-n{margin-left:auto;font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--lilac);color:var(--plum2);white-space:nowrap;flex:0 0 auto}
  .ev-sub{font-size:11px;color:var(--muted);margin-bottom:9px}
  .chart{width:100%}
  .ev-read{font-family:var(--chat);font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:9px}
  .ev-read b{color:var(--plum)}
  .ev-f{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
  .ev-read{margin-bottom:11px}
  .showmap{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:#fff;font-family:var(--disp);font-size:11.5px;font-weight:700;color:var(--plum2);cursor:pointer;transition:.15s}
  .showmap:hover{border-color:var(--violet);background:var(--lilac3)}
  .showmap svg{width:12px;height:12px}
  .ev.on .showmap{background:var(--plum2);border-color:var(--plum2);color:#fff}
  .legend{display:flex;gap:12px;margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

  /* hero figure inside a card */
  .hero{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--plum);line-height:1}
  .hero small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:4px}

  /* verdict */
  .verdict{border:1px solid #BFE3CE;background:#F0FAF4;border-radius:14px;padding:14px 16px;margin-bottom:18px}
  .verdict .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#1F7A4C;margin-bottom:7px}
  .verdict p{font-family:var(--chat);font-size:14px;color:#123D28;line-height:1.6}
  .verdict .rows{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}
  .vrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#245239;font-weight:600}
  .vrow .tick{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#1F7A4C}
  .vrow .tick.no{background:var(--muted2)}
  .vrow .tick svg{width:9px;height:9px;stroke:#fff}

  /* tooltip */
  .tt{position:fixed;z-index:900;background:#211A2E;color:#fff;border-radius:9px;padding:7px 10px;font-family:var(--body);font-size:11.5px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .tt.show{opacity:1}
  .tt em{display:block;font-style:normal;font-weight:600;color:#C9BEF0;font-size:10.5px;margin-top:2px}

  /* map */
  #map{position:absolute;inset:0}
  .leaflet-container{background:#E8E6EF;font-family:var(--body)}
  .mfloat{position:absolute;z-index:600;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px rgba(33,26,46,.07),0 16px 40px rgba(74,42,110,.14)}
  .mbanner{top:14px;left:50%;transform:translateX(-50%);padding:8px 14px;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--plum);display:flex;align-items:center;gap:8px;white-space:nowrap;opacity:0;transition:.3s}
  .mbanner.show{opacity:1}
  .mbanner .dot{width:7px;height:7px;border-radius:50%;background:var(--violet)}
  .mkey{left:14px;bottom:14px;padding:11px 13px;min-width:180px;opacity:0;transform:translateY(8px);transition:.35s cubic-bezier(.22,1,.36,1)}
  .mkey.show{opacity:1;transform:none}
  .mkey .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
  .krow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:5px}
  .krow:last-child{margin-bottom:0}
  .krow i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .poilab{width:max-content;font-family:var(--disp);font-weight:800;font-size:10.5px;color:#fff;border-radius:7px;padding:2px 8px;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .ringlab{width:max-content;font-family:var(--disp);font-weight:800;font-size:10px;color:#fff;background:var(--deep);border-radius:99px;padding:3px 8px;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
  @keyframes dashflow{to{stroke-dashoffset:-140}}
  .flow{stroke-dasharray:8 10;animation:dashflow 2.4s linear infinite}
</style>

<div class="wrap">
  <div class="ctrl">
    <span class="lbl">Layout</span>
    <div class="seg" id="seg">
      <button data-w="0">Chat 440px · map full</button>
      <button class="on" data-w="1">Chat 62% · map 38%</button>
    </div>
    <span class="note">The evidence needs room — the map steps back but stays live.</span>
    <span class="go"><button class="btn" id="replay">Replay validation</button></span>
  </div>

  <div class="body wide" id="body">
    <div class="rail">
      <div class="rail-h">
        <span class="spark"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 5.8L20 10l-5.8 2.2L12 18l-2.2-5.8L4 10l5.8-2.2z"/></svg></span>
        <span class="brand">Ask Lumos</span>
      </div>
      <div class="thread" id="thread"></div>
    </div>
    <div class="stage">
      <div id="map"></div>
      <div class="mfloat mbanner" id="banner"><span class="dot"></span><span id="bannerText"></span></div>
      <div class="mfloat mkey" id="mkey"></div>
    </div>
  </div>
</div>
<div class="tt" id="tt"></div>

<script>
/* ══ chart toolkit ═══════════════════════════════════════════════════════════
   Emphasis is the default form: the audience carries the accent hue, the metro
   baseline is the de-emphasis gray. Ordered scales use the one-hue ramp.       */
const TT=document.getElementById('tt');
function tipOn(el,html){
  el.addEventListener('mousemove',e=>{ TT.innerHTML=html; TT.classList.add('show');
    TT.style.left=Math.min(window.innerWidth-TT.offsetWidth-12,e.clientX+14)+'px';
    TT.style.top=(e.clientY-TT.offsetHeight-12)+'px'; });
  el.addEventListener('mouseleave',()=>TT.classList.remove('show'));
}
const SVGNS='http://www.w3.org/2000/svg';
function el(n,a){ const x=document.createElementNS(SVGNS,n); for(const k in a) x.setAttribute(k,a[k]); return x; }
// column with a 4px rounded cap, square at the baseline
function colPath(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function barPath(x,y,w,h,r){   // horizontal: rounded at the data end only
  r=Math.min(r,h/2,w);
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
}
// columns, with optional second series (grouped) — 2px surface gap, ≤24px thick
function columns(host,{data,max,fmt,series,labelEvery}){
  const W=host.clientWidth||300, H=118, padB=20, padT=16, n=data.length;
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,class:'chart'});
  const plotH=H-padB-padT, band=W/n, two=!!series;
  svg.appendChild(el('line',{x1:0,y1:H-padB,x2:W,y2:H-padB,stroke:'var(--grid)','stroke-width':1}));
  data.forEach((d,i)=>{
    const vals=two?[d.a,d.b]:[d.v];
    const thick=Math.min(24,(band-10)/(two?2:1)-(two?2:0));
    vals.forEach((v,k)=>{
      const h=Math.max(2,(v/max)*plotH);
      const gx=band*i+(band-(thick*(two?2:1)+(two?2:0)))/2+k*(thick+2);
      const fill=two?(k===0?'var(--acc)':'var(--ctx)'):(d.fill||'var(--acc)');
      const p=el('path',{d:colPath(gx,H-padB-h,thick,h,4),fill});
      tipOn(p, `${d.label} · ${fmt(v)}<em>${two?(k===0?series[0]:series[1]):(d.note||'')}</em>`);
      svg.appendChild(p);
      if(d.tag && k===0){
        const t=el('text',{x:gx+thick/2,y:H-padB-h-6,'text-anchor':'middle','font-size':10.5,'font-weight':700,fill:'#4A3E5C','font-family':'Baloo 2, sans-serif'});
        t.textContent=fmt(v); svg.appendChild(t);
      }
    });
    if(!labelEvery || i%labelEvery===0){
      const lb=el('text',{x:band*i+band/2,y:H-6,'text-anchor':'middle','font-size':10,fill:'#7E7490','font-family':'Nunito, sans-serif','font-weight':600});
      lb.textContent=d.label; svg.appendChild(lb);
    }
  });
  host.appendChild(svg);
}
// two horizontal bars: the audience against the metro baseline
function pairBars(host,{rows,max,fmt}){
  const W=host.clientWidth||300, rowH=30, H=rows.length*rowH+6;
  const svg=el('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,class:'chart'});
  const labelW=74, barW=W-labelW-46;
  rows.forEach((r,i)=>{
    const y=i*rowH+4, h=16;
    const lb=el('text',{x:0,y:y+h-3,'font-size':11,fill:'#4A3E5C','font-family':'Nunito, sans-serif','font-weight':700});
    lb.textContent=r.label; svg.appendChild(lb);
    svg.appendChild(el('rect',{x:labelW,y:y+1,width:barW,height:h-2,rx:4,fill:'#F4F1F7'}));
    const w=Math.max(3,(r.v/max)*barW);
    const p=el('path',{d:barPath(labelW,y,w,h,4),fill:r.ctx?'var(--ctx)':'var(--acc)'});
    tipOn(p,`${r.label} · ${fmt(r.v)}<em>${r.note||''}</em>`); svg.appendChild(p);
    const vt=el('text',{x:labelW+w+8,y:y+h-3,'font-size':11,'font-weight':700,fill:'#4A3E5C','font-family':'Baloo 2, sans-serif'});
    vt.textContent=fmt(r.v); svg.appendChild(vt);
  });
  host.appendChild(svg);
}

/* ══ the evidence ════════════════════════════════════════════════════════════ */
const RAMP=['var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
const EVIDENCE=[
  { id:'when', n:'Signal 1', t:'Weekday vs weekend', sub:'Share of visits by day',
    read:'<b>57%</b> of visits fall on Saturday or Sunday — the metro grocery average is 41%. A planned outing, not a top-up.',
    map:'Weekend density · Sat–Sun only',
    draw(host){ columns(host,{max:36,fmt:v=>v+'%',labelEvery:1,
      data:[{label:'Mon',v:7},{label:'Tue',v:7},{label:'Wed',v:8},{label:'Thu',v:9},{label:'Fri',v:12},
            {label:'Sat',v:33,fill:'var(--acc)',tag:1,note:'weekend'},{label:'Sun',v:24,fill:'var(--acc)',note:'weekend'}]
        .map(d=>({...d,fill:d.fill||'var(--ctx)'}))}); },
    legend:[['var(--acc)','Weekend'],['var(--ctx)','Weekday']] },

  { id:'far', n:'Signal 2', t:'Distance travelled', sub:'Share of trips by distance band',
    read:'Median <b>14 km</b> against a metro average of 8.4 km. Two thirds of trips start beyond 10 km.',
    map:'Distance rings · median vs metro',
    draw(host){ columns(host,{max:44,fmt:v=>v+'%',labelEvery:1,
      data:[{label:'≤5 km',v:12,fill:RAMP[0]},{label:'5–10',v:24,fill:RAMP[1]},
            {label:'10–15',v:24,fill:RAMP[2]},{label:'15+ km',v:40,fill:RAMP[3],tag:1}]}); },
    legend:[['var(--s2)','Nearer'],['var(--s5)','Further']] },

  { id:'repeat', n:'Signal 3', t:'Repeat visitors', sub:'Return within 60 days',
    read:'<b>68%</b> come back inside 60 days — 1.9× the category norm. They are not trying it once.',
    hero:['68%','RETURN WITHIN 60 DAYS'],
    map:'Density weighted to repeat households',
    draw(host){ columns(host,{max:44,fmt:v=>v+'%',labelEvery:1,
      data:[{label:'1 visit',v:32,fill:RAMP[0]},{label:'2–3',v:41,fill:RAMP[2],tag:1},{label:'4+',v:27,fill:RAMP[3]}]}); },
    legend:[['var(--s2)','One-off'],['var(--s5)','Frequent']] },

  { id:'ikea', n:'Signal 4', t:'IKEA overlap', sub:'Visited an IKEA in the last 90 days',
    read:'<b>3.4×</b> the metro rate. Destination retail begets destination retail.',
    map:'IKEA stores · co-visitation',
    draw(host){ pairBars(host,{max:60,fmt:v=>v+'%',rows:[
      {label:'This audience',v:41,note:'index 341'},{label:'Metro average',v:12,ctx:1}]}); },
    legend:[['var(--acc)','This audience'],['var(--ctx)','Metro average']] },

  { id:'bunnings', n:'Signal 5', t:'Bunnings overlap', sub:'Visited a Bunnings in the last 90 days',
    read:'<b>2.9×</b> the metro rate, and usually on the same trip — the chain runs hardware then grocery.',
    map:'Bunnings stores · co-visitation',
    draw(host){ pairBars(host,{max:60,fmt:v=>v+'%',rows:[
      {label:'This audience',v:56,note:'index 292'},{label:'Metro average',v:19,ctx:1}]}); },
    legend:[['var(--acc)','This audience'],['var(--ctx)','Metro average']] },

  { id:'household', n:'Signal 6', t:'Household size', sub:'People per household',
    read:'<b>66%</b> are four-person households or larger, against 29% across the metro. Explains the basket — not the distance.',
    map:'Households of 4+ only',
    draw(host){ columns(host,{max:44,fmt:v=>v+'%',series:['This audience','Metro average'],labelEvery:1,
      data:[{label:'1',a:4,b:22},{label:'2',a:11,b:29},{label:'3',a:19,b:20},{label:'4',a:38,b:18},{label:'5+',a:28,b:11}]}); },
    legend:[['var(--acc)','This audience'],['var(--ctx)','Metro average']] }
];

/* ══ map ═════════════════════════════════════════════════════════════════════ */
const STORE=[-33.7080,150.8450];
const ORIGINS=[
  {n:'Schofields',c:[-33.7100,150.8730],km:4.2,pct:7},{n:'Riverstone',c:[-33.6790,150.8580],km:5.1,pct:6},
  {n:'Box Hill',c:[-33.6650,150.8880],km:5.6,pct:5},{n:'Rouse Hill',c:[-33.6870,150.9200],km:7.6,pct:6},
  {n:'Blacktown',c:[-33.7710,150.9060],km:8.9,pct:7},{n:'St Marys',c:[-33.7660,150.7750],km:9.8,pct:5},
  {n:'Kellyville',c:[-33.7130,150.9560],km:11.2,pct:6},{n:'Windsor',c:[-33.6120,150.8210],km:11.9,pct:6},
  {n:'Castle Hill',c:[-33.7320,151.0050],km:14.8,pct:14},{n:'Penrith',c:[-33.7510,150.6940],km:16.4,pct:20},
  {n:'Richmond',c:[-33.5990,150.7510],km:18.2,pct:18}
];
const POIS={ ikea:[{n:'IKEA Marsden Park',c:[-33.7020,150.8390]},{n:'IKEA Rhodes',c:[-33.8300,151.0870]}],
             bunnings:[{n:'Bunnings Rouse Hill',c:[-33.6900,150.9160]},{n:'Bunnings Penrith',c:[-33.7480,150.7000]},
                       {n:'Bunnings Blacktown',c:[-33.7680,150.9000]},{n:'Bunnings Windsor',c:[-33.6180,150.8250]}] };
const map=L.map('map',{zoomControl:true,attributionControl:false,scrollWheelZoom:true}).setView([-33.715,150.865],10.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'markerPane',opacity:.9}).addTo(map);
function rnd(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function curve(a,b,bend,n){ const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1];
  const cp=[m[0]-dy*bend,m[1]+dx*bend],o=[]; for(let i=0;i<=n;i++){const t=i/n,u=1-t;
    o.push([u*u*a[0]+2*u*t*cp[0]+t*t*b[0],u*u*a[1]+2*u*t*cp[1]+t*t*b[1]]);} return o; }
const base=L.layerGroup().addTo(map), fx=L.layerGroup().addTo(map);
function drawBase(weight){
  base.clearLayers();
  ORIGINS.forEach((o,i)=>{
    const rr=rnd(i*67+11), n=Math.round(o.pct*(weight?weight(o):1)*2.6);
    for(let k=0;k<n;k++){ const a=rr()*Math.PI*2,d=Math.sqrt(rr())*0.017;
      L.circleMarker([o.c[0]+Math.sin(a)*d*0.82,o.c[1]+Math.cos(a)*d],
        {radius:3,stroke:false,fillColor:'#6B3C72',fillOpacity:.45,interactive:false}).addTo(base); }
  });
  L.circleMarker(STORE,{radius:8,color:'#fff',weight:3,fillColor:'#4A2A6E',fillOpacity:1,interactive:false}).addTo(base);
}
drawBase();
const banner=document.getElementById('banner'),bannerText=document.getElementById('bannerText'),mkey=document.getElementById('mkey');
function setKey(rows){ if(!rows){ mkey.classList.remove('show'); return; }
  mkey.innerHTML='<div class="k">On the map</div>'+rows.map(r=>`<div class="krow"><i style="background:${r[0]}"></i>${r[1]}</div>`).join('');
  mkey.classList.add('show'); }
const MAPVIEWS={
  when(){ drawBase(o=>1.5);       // weekend: the far origins swell, the near ones thin
    ORIGINS.forEach(o=>{ if(o.km<8) return;
      L.polyline(curve(o.c,STORE,0.12,26),{color:'#6B3C72',weight:1+o.pct*0.14,opacity:.75,className:'flow'}).addTo(fx); });
    setKey([['#6B3C72','Weekend trips (Sat–Sun)'],['#B084B8','Origins beyond 8 km']]);
    map.flyTo([-33.715,150.865],10.4,{duration:.6}); },
  far(){ [5,10,15,20].forEach(km=>{
      L.circle(STORE,{radius:km*1000,color:'#5A2E62',weight:1.2,opacity:.45,dashArray:'5 7',fill:false,interactive:false}).addTo(fx);
      L.marker([STORE[0]+(km/111)*0.82,STORE[1]],{interactive:false,icon:L.divIcon({html:`<div class="ringlab">${km} km</div>`,className:'',iconSize:[1,1]})}).addTo(fx); });
    L.circle(STORE,{radius:8400,color:'#0E7490',weight:2.2,opacity:.95,dashArray:'8 6',fill:false,interactive:false}).addTo(fx);
    L.circle(STORE,{radius:14000,color:'#4E2A54',weight:2.8,opacity:.95,fillColor:'#6B3C72',fillOpacity:.05,interactive:false}).addTo(fx);
    setKey([['#4E2A54','Median trip · 14 km'],['#0E7490','Metro average · 8.4 km']]);
    map.flyTo(STORE,10.2,{duration:.6}); },
  repeat(){ drawBase(o=>o.km>=10?1.7:0.5);
    setKey([['#6B3C72','Households returning within 60 days']]);
    map.flyTo([-33.715,150.865],10.4,{duration:.6}); },
  ikea(){ poi('ikea','#0058A3','IKEA'); },
  bunnings(){ poi('bunnings','#0D5257','Bunnings'); },
  household(){ drawBase(o=>o.pct>=10?1.8:0.45);
    setKey([['#6B3C72','Households of 4 or more']]);
    map.flyTo([-33.715,150.865],10.4,{duration:.6}); }
};
function poi(kind,col,label){
  POIS[kind].forEach(p=>{
    L.polyline(curve(p.c,STORE,0.14,24),{color:col,weight:2.4,opacity:.75,className:'flow'}).addTo(fx);
    L.circleMarker(p.c,{radius:7,color:'#fff',weight:2.5,fillColor:col,fillOpacity:1}).addTo(fx)
      .bindTooltip(p.n,{direction:'top'});
    L.marker(p.c,{interactive:false,icon:L.divIcon({html:`<div class="poilab" style="background:${col}">${label}</div>`,className:'',iconSize:[1,1],iconAnchor:[0,-18]})}).addTo(fx);
  });
  setKey([[col,label+' stores visited'],['#6B3C72','Costco Marsden Park']]);
  map.flyTo([-33.740,150.900],10,{duration:.6});
}
function showOnMap(ev){
  fx.clearLayers(); drawBase();
  bannerText.textContent=ev.map; banner.classList.add('show');
  (MAPVIEWS[ev.id]||function(){})();
  document.querySelectorAll('.ev').forEach(c=>c.classList.toggle('on',c.dataset.ev===ev.id));
}

/* ══ chat ════════════════════════════════════════════════════════════════════ */
const thread=document.getElementById('thread');
function add(html,delay){ const d=document.createElement('div'); d.className='fade'; d.innerHTML=html;
  thread.appendChild(d); setTimeout(()=>{d.classList.add('in');thread.scrollTop=thread.scrollHeight;},delay||30); return d; }

function evidenceGrid(){
  const wrap=add('<div class="evgrid" id="evgrid"></div>',60);
  const grid=wrap.querySelector('#evgrid');
  EVIDENCE.forEach((ev,i)=>{
    const card=document.createElement('div'); card.className='ev'; card.dataset.ev=ev.id;
    card.innerHTML=`<div class="ev-h"><span class="ev-t">${ev.t}</span><span class="ev-n">${ev.n}</span></div>
      <div class="ev-sub">${ev.sub}</div>
      ${ev.hero?`<div class="hero">${ev.hero[0]}<small>${ev.hero[1]}</small></div>`:''}
      <div class="chart-host"></div>
      <div class="ev-read">${ev.read}</div>
      <div class="ev-f">
        <button class="showmap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/></svg>Show on map</button>
        <span class="legend">${ev.legend.map(l=>`<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join('')}</span>
      </div>`;
    grid.appendChild(card);
    setTimeout(()=>ev.draw(card.querySelector('.chart-host')),80+i*40);
    card.querySelector('.showmap').onclick=()=>showOnMap(ev);
  });
}
function verdict(){
  const rows=[['Weekend concentration',1],['Distance travelled',1],['Repeat visitation',1],
              ['IKEA overlap',1],['Bunnings overlap',1],['Household size',0]];
  add(`<div class="verdict">
    <div class="k">Verdict</div>
    <p>Supported. Five of six signals point the same way — the trip is <b>planned, long, repeated and chained</b> to other destination retail. Household size explains the basket, not the distance.</p>
    <div class="rows">${rows.map(r=>`<div class="vrow"><span class="tick ${r[1]?'':'no'}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">${r[1]?'<path d="M5 13l4 4L19 7"/>':'<path d="M6 12h12"/>'}</svg></span>${r[0]}</div>`).join('')}</div>
  </div>`,80);
  add(`<div class="ai">Want me to turn this into a targeting rule — everyone inside the 20–30 km band who also visits Bunnings or IKEA on a weekend?</div>`,300);
}
function run(){
  thread.innerHTML=''; fx.clearLayers(); drawBase();
  banner.classList.remove('show'); setKey(null);
  add(`<div class="user"><span>Yes — validate this</span></div>`,30);
  add(`<div class="ai">Testing it now. I’ll compare six signals against a like-for-like grocery baseline — if this is destination shopping, the trip should be long, planned, repeated and chained to other big-box retail.</div>`,220);
  add(`<div class="ai">Here’s the evidence. Each one can drive the map — <b>Show on map</b> puts that filter on the geography.</div>`,700);
  setTimeout(evidenceGrid,900);
  setTimeout(verdict,1700);
}
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.getElementById('body').classList.toggle('wide',b.dataset.w==='1');
  setTimeout(()=>{ map.invalidateSize();
    document.querySelectorAll('.ev').forEach(c=>{ const h=c.querySelector('.chart-host'); const ev=EVIDENCE.find(x=>x.id===c.dataset.ev);
      h.innerHTML=''; ev.draw(h); }); },620);
});
document.getElementById('replay').onclick=run;
run();
</script>
