<meta charset="utf-8">
<title>Follow-up explorations — how the map answers each question</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --plum:#4A2A6E; --plum2:#6B3C72; --violet:#7C4FC7; --deep:#4E2A54;
    --ink:#1A1A1A; --ink2:#4A3E5C; --muted:#7E7490; --muted2:#A79FB6;
    --line:#EBE5F1; --line2:#E1D9EC; --lilac:#EFE8F8; --lilac3:#F5F0FB;
    --pink:#E11D74; --teal:#0E9384; --amber:#C07A2E; --green:#2F8F63;
    --disp:"Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif; --chat:"Jua",system-ui,sans-serif;
  }
  body{font-family:var(--body);background:#2E2E2E;color:var(--ink);height:100vh;overflow:hidden}
  .wrap{display:flex;height:100vh;background:#fff}

  /* ── chat rail (matches the prototype) ─────────────────────────────────── */
  .rail{width:400px;flex:0 0 400px;border-right:1px solid #e5e5e2;display:flex;flex-direction:column;min-height:0;background:#fff}
  .rail-h{padding:16px 22px 13px;border-bottom:1px solid var(--line)}
  .eyebrow{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
  .rail-h h1{font-family:var(--disp);font-size:16px;font-weight:700;margin-top:3px}
  .thread{flex:1;overflow-y:auto;padding:20px 22px;min-height:0}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:99px;border:1px solid #7A4C8244;background:#7A4C8212;color:#7A4C82;font-family:var(--disp);font-size:11px;font-weight:700;margin-bottom:10px}
  .chip i{width:17px;height:17px;border-radius:50%;background:#7A4C82;display:grid;place-items:center}
  .chip i svg{width:10px;height:10px}
  .user{display:flex;justify-content:flex-end;margin-bottom:18px}
  .user span{max-width:85%;background:#e7e7e7;border-radius:12px 12px 0 12px;padding:10px 14px;font-family:var(--chat);font-size:14px;color:#000;opacity:.7;line-height:1.5}
  .ai{font-family:var(--chat);font-size:15.5px;color:#140934;line-height:1.6;margin-bottom:16px}
  .ai.lead{font-size:16px}
  .qs{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
  .q{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:13px 14px;background:#f8f8f8;border:1px solid transparent;border-radius:11px;cursor:pointer;transition:.16s;font-family:var(--chat);font-size:14px;color:#1a1a1a;line-height:1.45}
  .q:hover{background:#f1ecfb;border-color:#d9cdf0}
  .q.on{background:#f1e9ff;border-color:var(--plum2)}
  .q .ic{width:22px;height:22px;border-radius:7px;background:#fff;border:1px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
  .q .ic svg{width:12px;height:12px;color:var(--plum2)}
  .fade{opacity:0;transform:translateY(9px);transition:.45s cubic-bezier(.22,1,.36,1)}
  .fade.in{opacity:1;transform:none}

  .note{margin:0 22px 18px;padding:12px 14px;background:var(--lilac3);border:1px solid var(--line2);border-radius:12px}
  .note .eyebrow{margin-bottom:6px;color:var(--plum2)}
  .note p{font-size:12px;color:var(--ink2);line-height:1.55}
  .note b{color:var(--plum)}

  .rail-f{padding:12px 22px 16px;border-top:1px solid var(--line)}
  .btn{width:100%;font-family:var(--disp);font-size:13px;font-weight:700;padding:11px;border-radius:11px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;transition:.16s}
  .btn:hover{border-color:var(--violet);color:var(--plum2)}

  /* ── map ──────────────────────────────────────────────────────────────── */
  .stage{flex:1;position:relative;min-width:0;background:#E8E6EF}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#E8E6EF;font-family:var(--body)}
  .float{position:absolute;z-index:600;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(33,26,46,.07),0 18px 44px rgba(74,42,110,.14);backdrop-filter:blur(10px)}
  .banner{top:16px;left:50%;transform:translateX(-50%);padding:9px 16px;font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--plum);display:flex;align-items:center;gap:9px;white-space:nowrap;opacity:0;transition:.3s}
  .banner.show{opacity:1}
  .banner .dot{width:8px;height:8px;border-radius:50%;background:var(--violet)}
  .panel{left:16px;bottom:16px;padding:13px 15px;min-width:232px;max-width:280px;opacity:0;transform:translateY(8px);transition:.35s cubic-bezier(.22,1,.36,1)}
  .panel.show{opacity:1;transform:none}
  .panel .eyebrow{margin-bottom:10px}
  .prow{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink2);margin-bottom:7px;font-weight:600}
  .prow:last-child{margin-bottom:0}
  .prow .sw{width:20px;height:10px;border-radius:3px;flex:0 0 auto}
  .prow .num{font-family:var(--disp);font-weight:800;color:var(--plum);margin-left:auto;font-size:12px}
  .bar{height:7px;border-radius:99px;background:var(--lilac);overflow:hidden;flex:1;min-width:54px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--plum2)}
  .big{font-family:var(--disp);font-size:26px;font-weight:800;color:var(--plum);line-height:1}
  .big small{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-top:3px;letter-spacing:.02em}

  /* map markers */
  .storemk{width:32px;height:32px;border-radius:50%;background:var(--plum);border:3px solid #fff;box-shadow:0 3px 12px rgba(74,42,110,.45);display:grid;place-items:center}
  .storemk svg{width:16px;height:16px}
  .storelab,.ringlab,.pill,.stopnum,.brandlab{font-family:var(--disp);white-space:nowrap;font-weight:800}
  .storelab{font-size:11px;color:#fff;background:var(--plum);border-radius:8px;padding:3px 9px;transform:translate(-50%,-50%);box-shadow:0 2px 9px rgba(74,42,110,.4)}
  .ringlab{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#fff;background:var(--deep);border-radius:99px;padding:3px 9px;transform:translate(-50%,-50%);box-shadow:0 0 0 1.6px rgba(255,255,255,.92),0 3px 10px rgba(33,26,46,.34)}
  .ringlab.alt{background:#0E7490;}
  .pill{font-size:11px;color:#fff;border-radius:99px;padding:3px 9px;box-shadow:0 0 0 2px #fff,0 3px 10px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
  .stopnum{width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;font-size:12px;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(225,29,116,.45)}
  .stoplab{font-family:var(--disp);font-weight:700;font-size:10.5px;color:var(--deep);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:7px;padding:2px 7px;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 2px 7px rgba(33,26,46,.14)}
  .brandmk{border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.3);color:#fff;font-family:var(--disp);font-weight:800}
  .brandlab{font-size:10.5px;color:#fff;border-radius:7px;padding:2px 8px;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  @keyframes dashflow{to{stroke-dashoffset:-140}}
  .flow{stroke-dasharray:9 11;animation:dashflow 2.4s linear infinite}
  .tip{background:#211A2E!important;color:#fff!important;border:none!important;border-radius:9px!important;font-family:var(--body)!important;font-size:12px!important;font-weight:700!important;padding:6px 10px!important}
  .tip::before{border-top-color:#211A2E!important}
</style>

<div class="wrap">
  <div class="rail">
    <div class="rail-h">
      <div class="eyebrow">Step 5 · exploring the twin</div>
      <h1>Follow-up questions → map states</h1>
    </div>
    <div class="thread" id="thread"></div>
    <div class="note" id="note" style="display:none">
      <div class="eyebrow">What the map is doing</div>
      <p id="noteText"></p>
    </div>
    <div class="rail-f"><button class="btn" id="reset">Start again</button></div>
  </div>
  <div class="stage">
    <div id="map"></div>
    <div class="float banner" id="banner"><span class="dot"></span><span id="bannerText"></span></div>
    <div class="float panel" id="panel"></div>
  </div>
</div>

<script>
/* ── data ─────────────────────────────────────────────────────────────────── */
const STORE=[-33.7080,150.8450];
// every origin carries its distance and its share of trips, so the distance
// view and the origin view can never contradict each other
const ORIGINS=[
  {n:'Schofields',  c:[-33.7100,150.8730], km:4.2,  pct:7},
  {n:'Riverstone',  c:[-33.6790,150.8580], km:5.1,  pct:6},
  {n:'Box Hill',    c:[-33.6650,150.8880], km:5.6,  pct:5},
  {n:'Rouse Hill',  c:[-33.6870,150.9200], km:7.6,  pct:6},
  {n:'Blacktown',   c:[-33.7710,150.9060], km:8.9,  pct:7},
  {n:'St Marys',    c:[-33.7660,150.7750], km:9.8,  pct:5},
  {n:'Kellyville',  c:[-33.7130,150.9560], km:11.2, pct:6},
  {n:'Windsor',     c:[-33.6120,150.8210], km:11.9, pct:6},
  {n:'Castle Hill', c:[-33.7320,151.0050], km:14.8, pct:14},
  {n:'Penrith',     c:[-33.7510,150.6940], km:16.4, pct:20},
  {n:'Richmond',    c:[-33.5990,150.7510], km:18.2, pct:18}
];
const MEDIAN_KM=14, METRO_KM=8.4;
const BANDS=[{km:5,pct:12},{km:10,pct:24},{km:15,pct:24},{km:20,pct:40}];
// the Saturday chain, and two lesser variants
const CHAINS=[
  {pct:38, col:'#E11D74', stops:[
    {n:'Home · Schofields', c:[-33.7100,150.8730], t:'8:40am'},
    {n:'School drop-off',   c:[-33.7040,150.8620], t:'8:55am'},
    {n:'Café',              c:[-33.6990,150.8560], t:'9:20am'},
    {n:'Bunnings',          c:[-33.7020,150.8490], t:'10:05am'},
    {n:'Costco',            c:STORE,               t:'11:00am'}]},
  {pct:21, col:'#A32C8E', stops:[
    {n:'Home · Rouse Hill', c:[-33.6870,150.9200], t:'9:10am'},
    {n:'Fuel',              c:[-33.6960,150.8880], t:'9:30am'},
    {n:'Costco',            c:STORE,               t:'10:05am'}]},
  {pct:14, col:'#7C3A9C', stops:[
    {n:'Home · Blacktown',  c:[-33.7710,150.9060], t:'10:20am'},
    {n:'Kids sport',        c:[-33.7480,150.8880], t:'10:45am'},
    {n:'Costco',            c:STORE,               t:'12:15pm'}]}
];
const COMPETITORS=[
  {n:'Woolworths', c:[-33.7320,150.8760], col:'#2F8F63', share:34, switch:11, r:26},
  {n:'Coles',      c:[-33.6870,150.9210], col:'#C0392B', share:28, switch:9,  r:24},
  {n:'ALDI',       c:[-33.7690,150.8180], col:'#1E5AA8', share:24, switch:14, r:23},
  {n:'BIG W',      c:[-33.7690,150.9080], col:'#C07A2E', share:14, switch:6,  r:19}
];

/* ── the four follow-ups ─────────────────────────────────────────────────── */
const QUESTIONS=[
  { id:'far',    q:'How far do they travel?',
    ai:'A median of <b>14 km</b> each way — 1.7× the Greater Sydney average of 8.4 km. Two thirds of trips come from beyond 10 km, which is why roadside media works so much harder than letterbox here.',
    note:'Distance rings at 5/10/15/20 km, with a contrasting dashed ring at the <b>metro average</b> so the gap is the point. Every trip is drawn as a straight spoke, coloured light→deep by how far it runs. The panel carries the distribution.' },
  { id:'from',   q:"Which suburbs are they coming from?",
    ai:'Concentrated, but not where you would guess. <b>Penrith, Richmond and Castle Hill</b> alone send just over half the trips — three outer centres with no warehouse club of their own.',
    note:'Flows drop away and the <b>origins become the map</b> — each suburb shaded by its share of trips, top five ranked and labelled. This is the buying view: where to place letterbox, local radio and community media.' },
  { id:'before', q:'What do they do before visiting Costco?',
    ai:'It is a chained Saturday morning. <b>38%</b> run school drop-off → café → Bunnings → Costco, arriving around 11am. The trip is decided the night before and the route barely varies.',
    note:'The map becomes a <b>journey, not a heatmap</b> — the dominant chain drawn as a numbered route with arrival times, two lesser variants behind it. This is what makes the 9–11am roadside window buyable.' },
  { id:'switch', q:'Which competitor are they switching from?',
    ai:'Mostly <b>ALDI and Woolworths</b>. ALDI holds a smaller share of basket but a far higher switching rate — these households already buy on unit price, so the argument is already won.',
    note:'Competitor stores sized by <b>share of basket today</b>, with switching flows into the new site weighted by propensity. The insight is the mismatch: the biggest share is not the biggest opportunity.' }
];

/* ── map ─────────────────────────────────────────────────────────────────── */
const map=L.map('map',{zoomControl:true,attributionControl:true,scrollWheelZoom:true}).setView([-33.720,150.870],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'markerPane',opacity:.9}).addTo(map);

const base=L.layerGroup().addTo(map);   // the audience field, always there
const fx=L.layerGroup().addTo(map);     // whatever the current answer draws
function rng(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function curve(a,b,bend,n){
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1];
  const cp=[mid[0]-dy*bend,mid[1]+dx*bend],out=[];
  for(let i=0;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*a[0]+2*u*t*cp[0]+t*t*b[0],u*u*a[1]+2*u*t*cp[1]+t*t*b[1]]);}
  return out;
}
function blob(lat,lng,r,seed){
  const pts=[],N=40;
  for(let i=0;i<N;i++){const a=(i/N)*Math.PI*2;const rad=r*(0.9+((Math.sin(a*3+seed)+1)/2)*0.2);
    pts.push([lat+Math.sin(a)*rad*0.82,lng+Math.cos(a)*rad]);}
  return pts;
}
function drawBase(){
  base.clearLayers();
  ORIGINS.forEach((o,i)=>{
    const rr=rng(i*61+11), n=Math.round(o.pct*4.2);
    for(let k=0;k<n;k++){
      const a=rr()*Math.PI*2,d=Math.sqrt(rr())*0.019;
      L.circleMarker([o.c[0]+Math.sin(a)*d*0.82,o.c[1]+Math.cos(a)*d],
        {radius:2.9,stroke:false,fillColor:'#7A4C82',fillOpacity:.4,interactive:false}).addTo(base);
    }
  });
}
function storePin(){
  L.marker(STORE,{interactive:false,zIndexOffset:900,icon:L.divIcon({className:'',iconSize:[32,32],iconAnchor:[16,16],
    html:'<div class="storemk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l1.4-4.2A2 2 0 017.3 9.4h9.4a2 2 0 011.9 1.4L20 15"/><path d="M4 15h16v3H4z"/></svg></div>'})}).addTo(fx);
  L.marker([STORE[0]-0.012,STORE[1]],{interactive:false,zIndexOffset:900,
    icon:L.divIcon({html:'<div class="storelab">Costco Marsden Park</div>',className:'',iconSize:[1,1]})}).addTo(fx);
}
const kmToDeg=km=>km/111;
const banner=document.getElementById('banner'),bannerText=document.getElementById('bannerText');
const panel=document.getElementById('panel');
function setPanel(html){ panel.innerHTML=html; panel.classList.add('show'); }
function setBanner(t){ bannerText.textContent=t; banner.classList.add('show'); }

/* ── A · how far do they travel ──────────────────────────────────────────── */
function viewFar(){
  // the comparison that makes "significantly further" land
  const rings=[5,10,15,20];
  rings.forEach((km,i)=>{
    L.circle(STORE,{radius:km*1000,color:'#5A2E62',weight:1.3,opacity:.5,dashArray:'5 7',fill:false,interactive:false}).addTo(fx);
    L.marker([STORE[0]+kmToDeg(km)*0.82,STORE[1]],{interactive:false,zIndexOffset:700,
      icon:L.divIcon({html:`<div class="ringlab">${km} km</div>`,className:'',iconSize:[1,1]})}).addTo(fx);
  });
  // metro average vs this audience
  L.circle(STORE,{radius:METRO_KM*1000,color:'#0E7490',weight:2.4,opacity:.95,dashArray:'8 6',fill:false,interactive:false}).addTo(fx);
  L.marker([STORE[0]-kmToDeg(METRO_KM)*0.82,STORE[1]],{interactive:false,zIndexOffset:800,
    icon:L.divIcon({html:`<div class="ringlab alt">Metro average · ${METRO_KM} km</div>`,className:'',iconSize:[1,1]})}).addTo(fx);
  L.circle(STORE,{radius:MEDIAN_KM*1000,color:'#4E2A54',weight:3,opacity:.95,fill:true,fillColor:'#6B3C72',fillOpacity:.05,interactive:false}).addTo(fx);
  L.marker([STORE[0]-kmToDeg(MEDIAN_KM)*0.82,STORE[1]],{interactive:false,zIndexOffset:800,
    icon:L.divIcon({html:`<div class="ringlab">Median trip · ${MEDIAN_KM} km · 1.7×</div>`,className:'',iconSize:[1,1]})}).addTo(fx);
  // one spoke per origin, deeper the further it runs
  const shade=km=>km<=5?'#D6B9DA':km<=10?'#B084B8':km<=15?'#7A4C82':'#4E2A54';
  ORIGINS.forEach(o=>{
    L.polyline([o.c,STORE],{color:shade(o.km),weight:1.4+o.pct*0.18,opacity:.9,lineCap:'round'})
      .bindTooltip(`${o.n} · ${o.km} km · ${o.pct}% of trips`,{className:'tip',sticky:true}).addTo(fx);
    L.circleMarker(o.c,{radius:3.6,color:'#fff',weight:1.8,fillColor:shade(o.km),fillOpacity:1,interactive:false}).addTo(fx);
  });
  storePin();
  setBanner('How far they travel — trip length vs the metro average');
  setPanel(`<div class="eyebrow">Trip distance</div>
    <div class="big">14 km<small>MEDIAN EACH WAY · 1.7× METRO</small></div>
    <div style="margin-top:12px">
      ${BANDS.map((b,i)=>`<div class="prow"><span class="sw" style="background:${['#D6B9DA','#B084B8','#7A4C82','#4E2A54'][i]}"></span>
        <span>${i===0?'≤5':i===3?'15+':(BANDS[i-1].km+'–'+b.km)} km</span>
        <span class="bar"><i style="width:${b.pct*2.4}%"></i></span><span class="num">${b.pct}%</span></div>`).join('')}
    </div>`);
  map.flyTo([STORE[0]-0.02,STORE[1]+0.02],10.4,{duration:.7});
}

/* ── B · which suburbs are they coming from ─────────────────────────────── */
function viewFrom(){
  const ranked=[...ORIGINS].sort((a,b)=>b.pct-a.pct);
  const max=ranked[0].pct;
  ranked.forEach((o,i)=>{
    const t=o.pct/max, op=.14+t*.5;
    L.polygon(blob(o.c[0],o.c[1],0.012+t*0.016,i+5),
      {color:'#4E2A54',weight:i<5?1.6:0.9,opacity:i<5?.85:.4,fillColor:'#6B3C72',fillOpacity:op,interactive:true})
      .bindTooltip(`${o.n} · ${o.pct}% of trips · ${o.km} km out`,{className:'tip',sticky:true}).addTo(fx);
    if(i<5){
      L.marker(o.c,{interactive:false,zIndexOffset:700,
        icon:L.divIcon({html:`<div class="pill" style="background:#4E2A54">${i+1} · ${o.n} ${o.pct}%</div>`,className:'',iconSize:[1,1]})}).addTo(fx);
    }
  });
  storePin();
  setBanner('Which suburbs they come from — share of trips by origin');
  setPanel(`<div class="eyebrow">Top origins</div>
    ${ranked.slice(0,5).map((o,i)=>`<div class="prow"><span style="font-family:var(--disp);font-weight:800;color:var(--muted2);width:12px">${i+1}</span>
      <span style="min-width:66px">${o.n}</span><span class="bar"><i style="width:${o.pct/max*100}%"></i></span>
      <span class="num">${o.pct}%</span></div>`).join('')}
    <div class="prow" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted)">
      Top 5 carry <b style="color:var(--plum);margin-left:4px">${ranked.slice(0,5).reduce((s,o)=>s+o.pct,0)}%</b>&nbsp;of all trips</div>`);
  map.flyTo([-33.690,150.855],10.7,{duration:.7});
}

/* ── C · what they do before visiting ───────────────────────────────────── */
function viewBefore(){
  CHAINS.slice().reverse().forEach((ch)=>{
    const lead=ch===CHAINS[0];
    for(let i=0;i<ch.stops.length-1;i++){
      const pts=curve(ch.stops[i].c,ch.stops[i+1].c,0.10,24);
      L.polyline(pts,{color:ch.col,weight:lead?4.5:2.4,opacity:lead?.95:.4,lineCap:'round',className:lead?'flow':''})
        .bindTooltip(`${ch.stops[i].n} → ${ch.stops[i+1].n}`,{className:'tip',sticky:true}).addTo(fx);
    }
    if(lead){
      ch.stops.forEach((st,i)=>{
        L.marker(st.c,{interactive:false,zIndexOffset:800,icon:L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
          html:`<div class="stopnum">${i+1}</div>`})}).addTo(fx);
        // alternate above/below so consecutive stops never overlap
        const up = i % 2 === 0;
        L.marker(st.c,{interactive:false,zIndexOffset:801,
          icon:L.divIcon({html:`<div class="stoplab">${st.n} · ${st.t}</div>`,className:'',iconSize:[1,1],iconAnchor:[0,up?26:-26]})}).addTo(fx);
      });
    }
  });
  storePin();
  setBanner('The trip chain — what happens before the big shop');
  setPanel(`<div class="eyebrow">Most common chain</div>
    <div class="big">38%<small>OF SATURDAY TRIPS</small></div>
    <div style="margin-top:12px">
      ${CHAINS[0].stops.map((s,i)=>`<div class="prow"><span style="font-family:var(--disp);font-weight:800;color:#fff;background:${CHAINS[0].col};width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;flex:0 0 auto">${i+1}</span>
        <span>${s.n.split(' · ')[0]}</span><span class="num">${s.t}</span></div>`).join('')}
    </div>
    <div class="prow" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted)">
      Arrival window <b style="color:var(--plum);margin-left:4px">10–11am Sat</b></div>`);
  // frame the chain itself, not the metro
  const lats=CHAINS[0].stops.map(s=>s.c[0]), lngs=CHAINS[0].stops.map(s=>s.c[1]);
  const cb=L.latLngBounds([[Math.min(...lats),Math.min(...lngs)],[Math.max(...lats),Math.max(...lngs)]]);
  map.flyTo(cb.getCenter(), Math.min(13, map.getBoundsZoom(cb,false,L.point(120,120))), {duration:.7});
}

/* ── D · which competitor are they switching from ───────────────────────── */
function viewSwitch(){
  COMPETITORS.forEach(cp=>{
    const pts=curve(cp.c,STORE,0.16,26);
    L.polyline(pts,{color:cp.col,weight:1.4+cp.switch*0.42,opacity:.16,lineCap:'round',interactive:false}).addTo(fx);
    L.polyline(pts,{color:cp.col,weight:1+cp.switch*0.30,opacity:.95,lineCap:'round',className:'flow'})
      .bindTooltip(`${cp.n} → Costco · ${cp.switch}% switching propensity`,{className:'tip',sticky:true}).addTo(fx);
    L.marker(cp.c,{interactive:false,zIndexOffset:700,icon:L.divIcon({className:'',iconSize:[cp.r,cp.r],iconAnchor:[cp.r/2,cp.r/2],
      html:`<div class="brandmk" style="width:${cp.r}px;height:${cp.r}px;background:${cp.col};font-size:${cp.r>22?11:9.5}px">${cp.share}</div>`})}).addTo(fx);
    L.marker(cp.c,{interactive:false,zIndexOffset:701,
      icon:L.divIcon({html:`<div class="brandlab" style="background:${cp.col}">${cp.n}</div>`,className:'',iconSize:[1,1],iconAnchor:[0,-20]})}).addTo(fx);
  });
  storePin();
  setBanner('Where the switching comes from — share today vs propensity to move');
  setPanel(`<div class="eyebrow">Share of basket · switching</div>
    ${COMPETITORS.map(c=>`<div class="prow"><span class="sw" style="background:${c.col};border-radius:50%;width:11px;height:11px"></span>
      <span style="min-width:62px">${c.n}</span>
      <span class="bar"><i style="width:${c.share/34*100}%;background:${c.col}"></i></span>
      <span class="num" style="color:${c.col}">${c.switch}%</span></div>`).join('')}
    <div class="prow" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--muted);line-height:1.45">
      Bar = share today · number = <b style="color:var(--plum)">switching propensity</b></div>`);
  map.flyTo([-33.722,150.868],11,{duration:.7});
}

const VIEWS={far:viewFar,from:viewFrom,before:viewBefore,switch:viewSwitch};

/* ── chat ────────────────────────────────────────────────────────────────── */
const thread=document.getElementById('thread'),noteEl=document.getElementById('note'),noteText=document.getElementById('noteText');
function add(html,delay){
  const d=document.createElement('div'); d.className='fade'; d.innerHTML=html; thread.appendChild(d);
  setTimeout(()=>{d.classList.add('in');thread.scrollTop=thread.scrollHeight;},delay||30);
  return d;
}
const ICONS={far:'<path d="M12 2v20M5 9l7-7 7 7"/>',from:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/>',
  before:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',switch:'<path d="M7 16l-4-4 4-4"/><path d="M3 12h12"/><path d="M17 8l4 4-4 4"/><path d="M21 12H9"/>'};
function askBlock(){
  const d=add(`<div class="ai lead">Interesting. These customers travel <b>significantly further</b> than average.</div>
    <div class="ai" style="margin-bottom:12px">Would you like to understand:</div>
    <div class="qs" id="qs">${QUESTIONS.map(q=>`<button class="q" data-q="${q.id}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[q.id]}</svg></span>
      ${q.q}</button>`).join('')}</div>`,60);
  d.querySelectorAll('.q').forEach(b=>b.onclick=()=>answer(b.dataset.q,d));
}
function answer(id,block){
  const Q=QUESTIONS.find(q=>q.id===id);
  block.querySelectorAll('.q').forEach(b=>b.classList.toggle('on',b.dataset.q===id));
  add(`<div class="user"><span>${Q.q}</span></div>`,20);
  add(`<div class="ai">${Q.ai}</div>`,240);
  fx.clearLayers(); panel.classList.remove('show'); banner.classList.remove('show');
  setTimeout(()=>VIEWS[id](),120);
  noteEl.style.display='block'; noteText.innerHTML=Q.note;
  setTimeout(()=>{
    const d=add(`<div class="qs">${QUESTIONS.filter(q=>q.id!==id).map(q=>`<button class="q" data-q="${q.id}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[q.id]}</svg></span>
      ${q.q}</button>`).join('')}</div>`,60);
    d.querySelectorAll('.q').forEach(b=>b.onclick=()=>answer(b.dataset.q,d));
  },900);
}
function boot(){
  thread.innerHTML=''; fx.clearLayers(); noteEl.style.display='none';
  panel.classList.remove('show'); banner.classList.remove('show');
  add(`<span class="chip"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.6"/></svg></i>Selected on map · Marsden Park · Riverstone</span>
    <div class="ai">This audience is 2.3× more likely to be affluent families with larger households. They frequently visit Bunnings, IKEA and Costco Auburn on weekends — big-basket trips, made by car.</div>`,40);
  setTimeout(askBlock,700);
  map.flyTo([-33.720,150.870],11,{duration:.6});
  storePin();
}
document.getElementById('reset').onclick=boot;
drawBase(); boot();
</script>
